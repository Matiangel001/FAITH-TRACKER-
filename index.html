<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Faith Tracker" />
  <meta name="theme-color" content="#B08D57" />
  <meta name="description" content="A daily devotion and prayer journal — walk consistently with the Holy Spirit" />
  <link rel="manifest" href="manifest.json" />
  <title>Faith Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Crimson+Pro:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }

    /* ══════════════════════════════════════════════════════
       DESIGN TOKENS — Navy / Ivory / Gold / Sage
       Light mode is the default; dark mode overrides below.
       ══════════════════════════════════════════════════════ */
    :root {
      --bg-base:        #F8F4EC;
      --bg-glow-1:      rgba(176,141,87,0.07);
      --bg-glow-2:      rgba(111,141,104,0.05);
      --surface:        #FFFFFF;
      --surface-alt:    rgba(27,42,74,0.03);
      --surface-border: rgba(176,141,87,0.28);
      --surface-line:   rgba(176,141,87,0.4);
      --text-primary:   #1B2A4A;
      --text-heading:   #8A6A34;
      --text-secondary: rgba(27,42,74,0.58);
      --text-tertiary:  rgba(27,42,74,0.42);
      --text-faint:     rgba(27,42,74,0.28);
      --accent:         #B08D57;
      --accent-strong:  #96703C;
      --accent-soft:    rgba(176,141,87,0.13);
      --accent-border:  rgba(176,141,87,0.4);
      --accent-on:      #FBF8F2;
      --sage:           #5E7C57;
      --sage-soft:      rgba(94,124,87,0.14);
      --sage-border:    rgba(94,124,87,0.4);
      --error:          #A85236;
      --nav-bg:         rgba(255,255,255,0.92);
      --topbar-bg:      rgba(248,244,236,0.82);
      --input-bg:       rgba(27,42,74,0.035);
      --shadow-card:    0 1px 2px rgba(27,42,74,0.04), 0 6px 20px rgba(27,42,74,0.06);
      --shadow-lift:    0 4px 24px rgba(27,42,74,0.1);
      --overlay:        rgba(20,26,40,0.5);
    }
    [data-theme="dark"] {
      --bg-base:        #0F1626;
      --bg-glow-1:      rgba(217,188,133,0.08);
      --bg-glow-2:      rgba(143,174,132,0.05);
      --surface:        rgba(255,255,255,0.04);
      --surface-alt:    rgba(255,255,255,0.025);
      --surface-border: rgba(217,188,133,0.2);
      --surface-line:   rgba(217,188,133,0.32);
      --text-primary:   #F2EDE1;
      --text-heading:   #D9BC85;
      --text-secondary: rgba(242,237,225,0.6);
      --text-tertiary:  rgba(242,237,225,0.42);
      --text-faint:     rgba(242,237,225,0.28);
      --accent:         #D9BC85;
      --accent-strong:  #C9A66B;
      --accent-soft:    rgba(217,188,133,0.14);
      --accent-border:  rgba(217,188,133,0.35);
      --accent-on:      #0F1626;
      --sage:           #8FAE84;
      --sage-soft:      rgba(143,174,132,0.16);
      --sage-border:    rgba(143,174,132,0.4);
      --error:          #E0876A;
      --nav-bg:         rgba(15,22,38,0.94);
      --topbar-bg:      rgba(15,22,38,0.6);
      --input-bg:       rgba(255,255,255,0.045);
      --shadow-card:    0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.25);
      --shadow-lift:    0 8px 32px rgba(0,0,0,0.4);
      --overlay:        rgba(0,0,0,0.6);
    }

    body { background: var(--bg-base); font-family: 'Crimson Pro', Georgia, serif; color: var(--text-primary); transition: background .4s ease, color .4s ease; }

    .ft-root {
      height: 100vh; display: flex; flex-direction: column;
      background:
        radial-gradient(ellipse at 15% 8%, var(--bg-glow-1) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 90%, var(--bg-glow-2) 0%, transparent 45%),
        var(--bg-base);
      position: relative; overflow: hidden; color: var(--text-primary);
      transition: background .4s ease;
    }
    .ft-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 18px 20px 20px; position: relative; z-index: 1;
    }
    .ft-scroll::-webkit-scrollbar { display: none; }

    .ft-header {
      padding: 22px 20px 16px; text-align: center;
      border-bottom: 1px solid var(--surface-border);
      position: relative; z-index: 1; flex-shrink: 0;
    }
    .ft-logo { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 600; color: var(--text-heading); letter-spacing: 2.5px; text-transform: uppercase; }
    .ft-tagline { font-size: 11px; color: var(--text-tertiary); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; font-weight: 300; }

    /* ── TOP APP BAR ─────────────────────────────────────── */
    .ft-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: max(16px, env(safe-area-inset-top)) 16px 14px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      position: relative; z-index: 5; flex-shrink: 0;
    }
    .topbar-icon-btn {
      background: var(--surface-alt);
      border: 1px solid var(--surface-border);
      border-radius: 12px; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--text-secondary);
      cursor: pointer; transition: all .2s; flex-shrink: 0;
    }
    .topbar-icon-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-strong); }
    .topbar-title-wrap { flex: 1; text-align: center; overflow: hidden; padding: 0 4px; }
    .topbar-title {
      font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600;
      color: var(--text-heading); letter-spacing: .5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-sub {
      font-size: 10.5px; color: var(--text-tertiary);
      letter-spacing: 1.3px; text-transform: uppercase; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topbar-streak {
      display: flex; align-items: center; gap: 4px;
      background: var(--accent-soft); border: 1px solid var(--accent-border);
      border-radius: 20px; padding: 8px 11px; font-size: 12.5px;
      color: var(--accent-strong); font-weight: 600; white-space: nowrap;
    }

    /* ── DRAWER ───────────────────────────────────────────── */
    .drawer-overlay {
      position: fixed; inset: 0; background: var(--overlay);
      z-index: 40; animation: ftFade .25s ease;
    }
    .drawer-panel {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 80%; max-width: 300px;
      background: var(--bg-base);
      border-right: 1px solid var(--surface-border);
      z-index: 50; display: flex; flex-direction: column;
      padding: max(20px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom));
      animation: ftSlideIn .32s cubic-bezier(.16,1,.3,1);
      box-shadow: var(--shadow-lift);
    }
    @keyframes ftFade { from{opacity:0} to{opacity:1} }
    @keyframes ftSlideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }

    .drawer-header {
      display: flex; align-items: center; gap: 13px;
      padding: 0 20px 18px; margin-bottom: 8px;
      border-bottom: 1px solid var(--surface-border);
      position: relative;
    }
    .drawer-avatar {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .drawer-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .drawer-fellowship { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; }
    .drawer-close {
      position: absolute; top: -2px; right: 16px;
      background: none; border: none; color: var(--text-tertiary);
      font-size: 18px; cursor: pointer; padding: 6px;
    }
    .drawer-menu { flex: 1; overflow-y: auto; padding: 6px 12px; }
    .drawer-item {
      display: flex; align-items: center; gap: 13px; width: 100%;
      background: none; border: none; padding: 13px 12px;
      border-radius: 12px; font-family: 'Crimson Pro', serif; font-size: 15.5px;
      color: var(--text-secondary); cursor: pointer; text-align: left;
      transition: background .2s, color .2s;
    }
    .drawer-item .di-ic { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
    .drawer-item.active { background: var(--accent-soft); color: var(--text-primary); }
    .drawer-divider { height: 1px; background: var(--surface-border); margin: 8px 16px; }
    .drawer-footer {
      padding: 12px 20px 4px; font-size: 10.5px; color: var(--text-faint);
      text-align: center; letter-spacing: 1px;
    }

    .screen-fade { animation: screenFadeIn .35s ease; }
    @keyframes screenFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── ATMOSPHERIC RITUALS (Phase 2): Candle Flame ────────
       Decorative only — pointer-events:none so it can never intercept
       taps on inputs/buttons underneath or around it. */
    .candle-flame-wrap {
      position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
      width: 30px; height: 42px; pointer-events: none; z-index: 2; opacity: 0.82;
    }
    .candle-flame-wrap svg { width: 100%; height: 100%; display: block; }
    .candle-flame { transform-origin: 50% 100%; animation: flameFlicker 2.6s ease-in-out infinite; }
    @keyframes flameFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1) rotate(0deg); opacity: 0.88; }
      20%      { transform: scaleY(1.05) scaleX(0.97) rotate(-1.5deg); opacity: 0.96; }
      40%      { transform: scaleY(0.94) scaleX(1.04) rotate(1deg); opacity: 0.8; }
      60%      { transform: scaleY(1.08) scaleX(0.96) rotate(-0.5deg); opacity: 1; }
      80%      { transform: scaleY(0.97) scaleX(1.02) rotate(1.5deg); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .candle-flame { animation: flameFlickerReduced 4.5s ease-in-out infinite; }
      @keyframes flameFlickerReduced {
        0%, 100% { opacity: 0.82; }
        50%      { opacity: 0.92; }
      }
    }

    /* ── ATMOSPHERIC RITUALS (Phase 2): Night Watch (Evening Mode) ──
       Independent of the theme toggle — a soft navy wash layered behind
       content from 8:00 PM–5:59 AM local device time. Text/contrast tokens
       (--text-primary etc.) are left untouched, so this never overrides
       the user's chosen light/dark theme, just sits atop it subtly. */
    .ft-root.night-watch::before {
      content: ""; position: absolute; inset: 0;
      background: rgba(15, 22, 38, 0.16);
      pointer-events: none; z-index: 0;
    }
    .examen-prompt {
      position: relative; z-index: 1;
      background: rgba(15, 22, 38, 0.07);
      border: 1px solid rgba(217, 188, 133, 0.22);
      border-radius: 18px; padding: 18px 20px; margin-bottom: 16px; text-align: center;
    }
    .examen-prompt-label {
      font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-tertiary); margin-bottom: 8px; font-weight: 600;
    }
    .examen-prompt-text {
      font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic;
      color: var(--text-primary); line-height: 1.5;
    }

    /* ── BOTTOM NAV ─────────────────────────────────────── */
    .ft-nav {
      display: flex; justify-content: space-around;
      padding: 11px 0 max(16px, env(safe-area-inset-bottom));
      background: var(--nav-bg); border-top: 1px solid var(--surface-border);
      position: relative; z-index: 10; flex-shrink: 0;
      backdrop-filter: blur(14px);
    }
    .ft-nav-btn {
      background: none; border: none; color: var(--text-faint);
      font-family: 'Crimson Pro', serif; font-size: 10.5px; letter-spacing: 1.4px;
      text-transform: uppercase; cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 4px; padding: 4px 13px;
      transition: color .2s;
    }
    .ft-nav-btn.active { color: var(--accent-strong); }
    .ft-nav-btn .ic { font-size: 19px; }

    /* ── CARDS ──────────────────────────────────────────── */
    .ft-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px; padding: 22px; margin-bottom: 16px;
      position: relative; box-shadow: var(--shadow-card);
    }
    .ft-card::before {
      content: ''; position: absolute; top: 0; left: 22px; right: 22px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-top-line, var(--surface-line)), transparent);
      opacity: .7;
    }
    .ft-card-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--text-heading); margin-bottom: 14px; letter-spacing: .3px; }

    /* ── VERSE CARD ─────────────────────────────────────── */
    .ft-verse {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border); border-radius: 20px;
      padding: 26px 20px; margin-bottom: 16px; text-align: center;
      box-shadow: var(--shadow-card);
    }
    .ft-verse-text { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; font-weight: 500; line-height: 1.55; color: var(--text-primary); margin-bottom: 11px; }
    .ft-verse-ref { font-size: 11.5px; color: var(--accent-strong); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

    .glow-dot {
      width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
      margin: 0 auto 15px;
      box-shadow: 0 0 0 5px var(--accent-soft);
    }

    /* ── STATS ──────────────────────────────────────────── */
    .stats-row { display: flex; gap: 11px; margin-bottom: 16px; }
    .stat-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border); border-radius: 16px;
      padding: 15px 8px; text-align: center; flex: 1;
    }
    .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 700; color: var(--accent-strong); line-height: 1; }
    .stat-label { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-tertiary); margin-top: 5px; }

    /* ── FORM ELEMENTS ──────────────────────────────────── */
    .ft-label { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; display: block; }
    .ft-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--surface-border);
      border-radius: 13px; padding: 13px 15px; font-family: 'Crimson Pro', serif;
      font-size: 16px; color: var(--text-primary); outline: none; transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    .ft-input:focus { border-color: var(--accent-border); background: var(--surface); }
    .ft-input::placeholder { color: var(--text-faint); }
    textarea.ft-input { resize: vertical; min-height: 90px; line-height: 1.65; }
    .ft-field { margin-bottom: 17px; }

    /* ── BUTTONS ─────────────────────────────────────────── */
    .ft-btn {
      width: 100%; background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      border: none; border-radius: 14px; padding: 15px;
      font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600;
      letter-spacing: .6px; color: var(--accent-on); cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s; margin-top: 4px;
      box-shadow: 0 4px 14px rgba(176,141,87,0.25);
    }
    .ft-btn:active { opacity: .9; transform: scale(.99); }
    .ft-btn:disabled { opacity: .55; }
    .ft-btn.ghost {
      background: transparent; box-shadow: none;
      border: 1px solid var(--accent-border); color: var(--accent-strong);
      margin-top: 10px;
    }

    /* ── CHIPS ──────────────────────────────────────────── */
    .moods { display: flex; flex-wrap: wrap; gap: 8px; }
    .mood-chip {
      background: var(--surface-alt); border: 1px solid var(--surface-border);
      border-radius: 20px; padding: 8px 14px; font-size: 13.5px;
      color: var(--text-secondary); cursor: pointer; transition: all .2s;
      font-family: 'Crimson Pro', serif; user-select: none;
    }
    .mood-chip.sel { background: var(--accent-soft); border-color: var(--accent-border); color: var(--text-primary); font-weight: 500; }

    .time-btn {
      width: 100%; background: var(--surface-alt); border: 1px solid var(--surface-border);
      border-radius: 13px; padding: 13px 15px; color: var(--text-secondary);
      font-family: 'Crimson Pro', serif; font-size: 15px; text-align: left;
      cursor: pointer; margin-bottom: 8px; transition: all .2s;
      display: flex; justify-content: space-between; align-items: center;
    }
    .time-btn.sel { background: var(--accent-soft); border-color: var(--accent-border); color: var(--text-primary); }

    /* ── ENTRY / LIST ROWS ──────────────────────────────── */
    .entry { border-bottom: 1px solid var(--surface-border); padding: 15px 0; display: flex; gap: 13px; }
    .entry:last-child { border-bottom: none; }
    .entry-dot { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 0 4px var(--accent-soft); }
    .entry-date { font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px; }
    .entry-mood { font-size: 13px; color: var(--accent-strong); margin-bottom: 4px; }
    .entry-note { font-size: 15px; color: var(--text-secondary); line-height: 1.55; }

    /* ── PROGRESS ───────────────────────────────────────── */
    .prog-wrap { background: var(--surface-alt); border-radius: 8px; height: 7px; overflow: hidden; margin-top: 9px; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent-strong), var(--accent)); border-radius: 8px; transition: width .6s ease; }
    .heat-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 9px; }
    .heat-cell { aspect-ratio: 1; border-radius: 5px; background: var(--surface-alt); border: 1px solid var(--surface-border); }
    .heat-cell.done { background: var(--accent-soft); border-color: var(--accent-border); }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 7px; }
    .week-cell { aspect-ratio: 1; border-radius: 8px; background: var(--surface-alt); border: 1px solid var(--surface-border); display: flex; align-items: center; justify-content: center; font-size: 9.5px; color: var(--text-faint); font-family: 'Crimson Pro', serif; }
    .week-cell.done { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-strong); }

    /* ── TOAST ──────────────────────────────────────────── */
    .ft-toast {
      position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--accent-strong), var(--accent)); color: var(--accent-on);
      padding: 12px 24px; border-radius: 26px;
      font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600;
      z-index: 999; white-space: nowrap; animation: toastIn .3s ease;
      box-shadow: var(--shadow-lift);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── ONBOARDING / AUTH ──────────────────────────────── */
    .onboard { padding: 18px 0 26px; }
    .ob-step { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 7px; font-weight: 600; }
    .ob-title { font-family: 'Cormorant Garamond', serif; font-size: 31px; font-weight: 700; line-height: 1.22; color: var(--text-primary); margin-bottom: 9px; }
    .ob-sub { font-size: 16px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 28px; }

    /* ── MISC BANNERS ───────────────────────────────────── */
    .install-banner {
      background: var(--sage-soft); border: 1px solid var(--sage-border);
      border-radius: 14px; padding: 15px 17px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .install-banner p { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }
    .install-btn {
      background: var(--sage); border: none;
      border-radius: 10px; padding: 9px 15px; font-family: 'Cormorant Garamond', serif;
      font-size: 14px; font-weight: 600; color: #FBF8F2; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .today-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-soft); border: 1px solid var(--accent-border);
      border-radius: 20px; padding: 6px 13px; font-size: 13px; color: var(--accent-strong);
      margin-bottom: 15px; font-weight: 500;
    }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--surface-line), transparent); margin: 16px 0; }

    /* ── ANSWERED PRAYER CELEBRATION ────────────────────── */
    @keyframes answeredPulse {

const calcStreakFromDates = (dateStrings) => {
  const days = [...new Set(dateStrings)].sort((a,b) => new Date(b) - new Date(a));
  if (!days.length) return 0;
  let s = 0, check = new Date();
  check.setHours(0,0,0,0);
  for (const d of days) {
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diff = (check - dd) / 86400000;
    if (diff <= 1) { s++; check = dd; } else break;
  }
  return s;
};

  const audioCtxRef = useRef(null);

  const ensureAudioContext = () => {
    try {
      if (!audioCtxRef.current) {

    if (!soundEnabled) return;

      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      [880, 1318.51].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = now + i * 0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.09, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.75);
      });
    } catch (e) {}
  };

  // Soft ambient pad — low sine drone through a gentle lowpass filter,
  // with a slow swell so it doesn't feel like a flat, static tone.
  const startAmbient = () => {
    if (ambientNodesRef.current) return;

      const ctx = ensureAudioContext();
      if (!ctx) return;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 1.5);
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 900;
      master.connect(filter).connect(ctx.destination);

      const freqs = [110, 165, 220];
      const oscs = freqs.map(f => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;
        const oscGain = ctx.createGain();
        oscGain.gain.value = 1 / freqs.length;
        osc.connect(oscGain).connect(filter);

      lfo.frequency.value = 0.07;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.015;

    } catch (e) {}

    const hideRatio = familiarity < 25 ? 0.2 : familiarity < 55 ? 0.45 : familiarity < 85 ? 0.7 : 0.92;
    return text.split(" ").map((w, i) => {
      const pseudo = ((seed + i * 2654435761) % 1000) / 1000;
      const letters = w.replace(/[^A-Za-z]/g, "");
      if (letters.length <= 1 || pseudo >= hideRatio) return w;
      return w.replace(/[A-Za-z]/g, "_");
    }).join(" ");
  };

        const data = snap.data();
        transaction.update(ref, { currentCount: (data.currentCount || 0) + 1 });

    <div className="ft-root">
      {toast && <div className="ft-toast">{toast}</div>}
      <div className="ft-header"><div className="ft-logo">Faith Tracker</div></div>
      <div className="ft-scroll">
        <div className="onboard">
          <div className="glow-dot" />
          {step === 1 && (
            <>
              <div className="ob-step">Welcome</div>
              <div className="ob-title">Walk daily with the Holy Spirit</div>
              <div className="ob-sub">Log your devotions, write reflections, and build an unbreakable daily habit with God.</div>
              <div className="ft-field">
                <label className="ft-label">Your Name</label>
                <input className="ft-input" placeholder="e.g. Victor" value={user.name} onChange={e => setUser(u => ({...u, name: e.target.value}))} />
              </div>
              <div className="ft-field">
                <label className="ft-label">Fellowship / Church (optional)</label>
                <input className="ft-input" placeholder="e.g. Eklesia" value={user.fellowship} onChange={e => setUser(u => ({...u, fellowship: e.target.value}))} />
              </div>
              <button className="ft-btn" onClick={() => { if (!user.name.trim()) return showT("Please enter your name"); setStep(2); }}>Continue →</button>
            </>
          )}
          {step === 2 && (
            <>
              <div className="ob-step">Step 2 of 3</div>
              <div className="ob-title">Set your reminder time</div>
              <div className="ob-sub">When should we nudge you for your daily devotion?</div>
              {PRESETS.map(t => (
                <button key={t} className={`time-btn${rTime===t?" sel":""}`} onClick={() => setRTime(t)}>{t} {rTime===t && <span>✦</span>}</button>
              ))}
              <div className="divider" />
              <div className="ft-field">
                <label className="ft-label">Or set a custom time</label>
                <input type="time" className="ft-input" onChange={e => setRTime(e.target.value)} />
              </div>
              <button className="ft-btn" onClick={() => setStep(3)}>Continue →</button>
              <button className="ft-btn ghost" onClick={() => setStep(1)}>← Back</button>
            </>
          )}
          {step === 3 && (
            <>
              <div className="ob-step">Step 3 of 3</div>
              <div className="ob-title">A verse to hold onto</div>
              <div className="ob-sub">Is there a verse you're currently struggling with, or one you want to carry with you? Entirely optional — you can always add one later.</div>
              <div className="ft-field">
                <label className="ft-label">Reference</label>
                <input className="ft-input" placeholder="e.g. Philippians 4:6-7" value={scriptureRef} onChange={e => setScriptureRef(e.target.value)} />
              </div>
              <div className="ft-field">
                <label className="ft-label">Verse Text</label>
                <textarea className="ft-input" placeholder="Type it out, word for word..." value={scriptureText} onChange={e => setScriptureText(e.target.value)} rows={4} />
              </div>
              <button className="ft-btn" onClick={finishOnboarding}>Start My Journey ✦</button>
              <button className="ft-btn ghost" onClick={() => setStep(2)}>← Back</button>
            </>
          )}
        </div>
      </div>
    </div>
  );

  // ── HOME ──────────────────────────────────────────────
  if (screen === "home") {
    const hour = new Date().getHours();
    const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    const devotionDone = todaysEntries.length > 0;
    const activePrayers = prayers.filter(p => p.status === "praying").length;
    const yesterdayEntry = entries.find(e => e.date === yesterdayStr());
    const yesterdayMoodWord = yesterdayEntry ? yesterdayEntry.mood.replace(/^\S+\s*/, "") : null;
    return renderShell(
      <>
        {activeNudge && (
          <div className="install-banner" style={{background:"var(--accent-soft)", borderColor:"var(--accent-border)"}}>
            <p>{activeNudge.type === "emoji" ? `${activeNudge.mentorName} sent you ${activeNudge.content}` : `${activeNudge.mentorName}: "${activeNudge.content}"`}</p>
            <button className="install-btn" style={{background:"var(--accent)"}} onClick={dismissNudge}>✦</button>
          </div>
        )}
        {showInstall && (
          <div className="install-banner">
            <p>Install Faith Tracker on your home screen.</p>
            <button className="install-btn" onClick={handleInstall}>Install</button>
          </div>
        )}
        {!showInstall && !isStandalone && !installNudgeDismissed && entries.length >= 3 && (
          <div className="install-banner">
            <p>Loving this rhythm? Add Faith Tracker to your home screen — tap Share, then "Add to Home Screen."</p>
            <button className="install-btn" onClick={dismissInstallNudge}>Got it</button>
          </div>
        )}
        <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:23, fontWeight:600, color:"var(--text-primary)"}}>
          {greet}, {user.name} 🕊️
        </div>
        <div style={{fontSize:15, color:"var(--text-secondary)", fontStyle:"italic", marginTop:4, marginBottom:18}}>
          {yesterdayMoodWord
            ? `You said you were "${yesterdayMoodWord}" yesterday — let's continue that.`
            : "Make space for God today."}
        </div>

        <div className="ft-verse">
          <div className="glow-dot" />
          <div className="ft-verse-text">"{verse.text}"</div>
          <div className="ft-verse-ref">— {verse.ref}</div>
        </div>

        {isNightWatch && (
          <div className="examen-prompt">
            <div className="examen-prompt-label">Night Watch</div>
            <div className="examen-prompt-text">Where did you notice God's grace today?</div>
          </div>
        )}

        {fellowshipGoal && (
          <div className="ft-card">
            <div className="ft-card-title">{fellowshipGoal.label}</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--text-tertiary)"}}>
              <span>{fellowshipGoal.currentCount || 0} of {fellowshipGoal.targetCount} logged</span>
              <span>{Math.min(100, Math.round(((fellowshipGoal.currentCount||0) / fellowshipGoal.targetCount) * 100))}%</span>
            </div>
            <div className="prog-wrap"><div className="prog-fill" style={{width:`${Math.min(100, Math.round(((fellowshipGoal.currentCount||0) / fellowshipGoal.targetCount) * 100))}%`}} /></div>
            <div style={{fontSize:12.5,color:"var(--text-secondary)",marginTop:10,fontStyle:"italic"}}>Our fellowship, walking together. ✦</div>
          </div>
        )}

        <div className="rhythm-label">Today's Rhythm</div>

        <div className="rhythm-card" onClick={() => setScreen(devotionDone ? "history" : "log")}>
          <div className="rhythm-icon">📖</div>
          <div style={{flex:1}}>
            <div className="rhythm-title">Devotion</div>
            <div className="rhythm-sub">{devotionDone ? "Logged today ✦" : "Your rhythm awaits — begin again"}</div>
          </div>
          <div className="rhythm-arrow">{devotionDone ? "View →" : "Start →"}</div>
        </div>

        <div className="rhythm-card" onClick={() => setScreen("prayerlog")}>
          <div className="rhythm-icon">🙏</div>
          <div style={{flex:1}}>
            <div className="rhythm-title">Prayer</div>
            <div className="rhythm-sub">{activePrayers > 0 ? `${activePrayers} request${activePrayers===1?"":"s"} before the Lord` : "Nothing logged yet"}</div>
          </div>
          <div className="rhythm-arrow">Pray →</div>
        </div>

        <div className="rhythm-card" onClick={() => setScreen("scripture")}>
          <div className="rhythm-icon">📜</div>
          <div style={{flex:1}}>
            <div className="rhythm-title">Scripture Memory</div>
            <div className="rhythm-sub">{scriptures.length > 0 ? `${scriptures.length} verse${scriptures.length===1?"":"s"} hidden in your heart` : "Save your first verse"}</div>
          </div>
          <div className="rhythm-arrow">Practice →</div>
        </div>

        <div className="ft-card" style={{marginTop:6}}>
          <div className="ft-card-title">This Week</div>
          <div className="week-grid">
            {WDAYS.map((d,i) => {
              const day = new Date(); day.setDate(day.getDate() - (new Date().getDay() - i));
              const ds = day.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
              return <div key={i} className={`week-cell${entries.some(e=>e.date===ds)?" done":""}`}>{d}</div>;
            })}
          </div>
        </div>

        <div style={{marginTop:18}}>
          <button
            className="ft-btn"
            disabled={streak < 3 || snapshotLoading}
            style={{cursor: (streak < 3 || snapshotLoading) ? "not-allowed" : "pointer"}}
            onClick={handleShareSnapshot}
          >
            {snapshotLoading ? "Preparing your snapshot…" : "📸 Share My Snapshot"}
          </button>
          {streak < 3 && (
            <div style={{fontSize:12.5, color:"var(--text-tertiary)", textAlign:"center", marginTop:8}}>
              Reach a 3-day streak to unlock.
            </div>
          )}
        </div>
      </>
    );
  }

  // ── LOG ───────────────────────────────────────────────
  if (screen === "log") return renderShell(
    <>
      {todaysEntries.length > 0 && (
        <div className="today-badge">✦ {todaysEntries.length} entr{todaysEntries.length===1?"y":"ies"} today — add another</div>
      )}
      <div className="ft-card">
        <div className="ft-card-title">How are you feeling?</div>
        <div className="moods">
          {MOODS.map(m => <div key={m} className={`mood-chip${mood===m?" sel":""}`} onClick={() => setMood(m)}>{m}</div>)}
        </div>
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Bible Passage</div>
        <input className="ft-input" placeholder="e.g. John 3:16, Psalms 23..." value={passage} onChange={e => setPassage(e.target.value)} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Your Reflection</div>
        <textarea className="ft-input" placeholder="What did the Holy Spirit speak to you today?" value={reflect} onChange={e => setReflect(e.target.value)} rows={5} />
      </div>
      <button className="ft-btn" onClick={submitLog}>Save Entry ✦</button>
    </>
  );

  // ── PRAYER HUB ──────────────────────────────────────────
  if (screen === "prayer") {
    const filtered = prayers.filter(p => prayerFilter === "all" ? true : p.status === prayerFilter);
    const totalHours = prayers.reduce((sum, p) => sum + (Number(p.hours) || 0), 0);
    return renderShell(
      <>
        <button className="ft-btn" onClick={() => setScreen("prayerlog")}>🙏 Add Prayer Request</button>

        <div className="ft-card" style={{marginTop:16, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12}}>
          <div>
            <div className="ft-card-title" style={{marginBottom:2}}>Ambient Sound</div>
            <div style={{fontSize:12.5, color:"var(--text-tertiary)"}}>Soft background sound while you pray — off by default</div>
          </div>
          <button
            type="button"
            role="switch"
            aria-checked={soundEnabled}
            aria-label={soundEnabled ? "Turn off ambient prayer sound" : "Turn on ambient prayer sound"}
            className={`sound-toggle${soundEnabled ? " on" : ""}`}
            onClick={() => {
              const next = !soundEnabled;
              if (next) ensureAudioContext(); // unlock audio synchronously within this tap
              setSoundEnabled(next);
            }}
          >
            <span className="sound-toggle-knob" />
          </button>
        </div>

        <div className="stats-row" style={{marginTop:16}}>
          <div className="stat-box"><div className="stat-num">{totalHours}</div><div className="stat-label">Hours Prayed</div></div>
          <div className="stat-box"><div className="stat-num">{prayers.filter(p=>p.status==="praying").length}</div><div className="stat-label">Active</div></div>
          <div className="stat-box"><div className="stat-num">{prayers.filter(p=>p.status==="answered").length}</div><div className="stat-label">Answered</div></div>
        </div>
        <div className="moods" style={{margin:"16px 0"}}>
          {[["praying","Praying"],["answered","Answered"],["all","All"]].map(([id,lb]) => (
            <div key={id} className={`mood-chip${prayerFilter===id?" sel":""}`} onClick={() => setPrayerFilter(id)}>{lb}</div>
          ))}
        </div>
        <div className="ft-card">
          {filtered.length === 0 ? (
            <div style={{textAlign:"center",color:"var(--text-faint)",padding:"20px 0",fontStyle:"italic"}}>
              {prayerFilter === "answered" ? "No answered prayers recorded yet." : "Nothing logged here yet."}
            </div>
          ) : filtered.map(p => (
            <div key={p.id} className={`entry${p.id===justAnsweredId?" answered-pulse":""}`}>
              <div className="entry-dot" style={p.status==="answered" ? {background:"var(--sage)", boxShadow:"0 0 0 4px var(--sage-soft)"} : undefined} />
              <div style={{flex:1}}>
                <div className="entry-date">
                  {p.category}{p.date && <span style={{color:"var(--text-faint)"}}> · {p.date}</span>}
                  {p.hours ? <span style={{color:"var(--accent-strong)"}}> · {p.hours} hr{p.hours==1?"":"s"}</span> : null}
                  {p.status==="answered" && <span style={{color:"var(--sage)"}}> · Answered ✦</span>}
                </div>
                <div className="entry-note">{p.text}</div>
                {p.scripture && <div className="entry-mood" style={{marginTop:4}}>{p.scripture}</div>}
                {p.status==="answered" && p.answeredNote && (
                  <div style={{fontSize:13,color:"var(--sage)",fontStyle:"italic",marginTop:6,lineHeight:1.5}}>"{p.answeredNote}"</div>
                )}
                {p.status==="praying" && (
                  <button className="ft-btn ghost" style={{marginTop:10,padding:"8px 12px",fontSize:13}} onClick={() => markAnswered(p.id)}>✦ Mark as Answered</button>
                )}
              </div>
            </div>
          ))}
        </div>
      </>
    );
  }

  // ── ADD PRAYER ────────────────────────────────────────
  if (screen === "prayerlog") return renderShell(
    <>
      <div className="ft-card">
        <div className="ft-card-title">Category</div>
        <div className="moods">
          {PRAYER_CATEGORIES.map(c => (
            <div key={c} className={`mood-chip${prayerCategory===c?" sel":""}`} onClick={() => setPrayerCategory(c)}>{c}</div>
          ))}
        </div>
      </div>
      <div className="ft-card">
        <div className="ft-card-title">What are you praying for?</div>
        <textarea className="ft-input" placeholder="Write your prayer request..." value={prayerText} onChange={e => setPrayerText(e.target.value)} rows={4} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Scripture (optional)</div>
        <input className="ft-input" placeholder="e.g. Philippians 4:6-7" value={prayerScripture} onChange={e => setPrayerScripture(e.target.value)} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Hours Spent in Prayer</div>
        <input type="number" min="1" step="0.5" className="ft-input" placeholder="Minimum 1 hour" value={prayerHours} onChange={e => setPrayerHours(e.target.value)} />
        <p style={{fontSize:12,color:"var(--text-tertiary)",lineHeight:1.5,marginTop:8}}>
          Log the time you actually spent in prayer — minimum 1 hour per entry.
        </p>
      </div>
      <button className="ft-btn" onClick={submitPrayer}>Save Prayer ✦</button>
    </>
  );

  // ── JOURNEY (unified devotion + prayer timeline) ───────
  if (screen === "history") {
    const journeyItems = [
      ...entries.map(e => ({ kind: "devotion", sortKey: e.createdAtMs || 0, ...e })),
      ...prayers.map(p => ({ kind: p.status === "answered" ? "answered" : "prayer", sortKey: p.createdAtMs || 0, ...p })),
    ].sort((a,b) => b.sortKey - a.sortKey);

    const filteredJourney = journeyItems.filter(item => {
      if (journeyFilter === "all") return true;
      return item.kind === journeyFilter;
    });

    const answeredCount = prayers.filter(p => p.status === "answered").length;

    return renderShell(
      <>
        {journeyItems.length > 0 && (
          <div style={{fontSize:14, color:"var(--text-secondary)", fontStyle:"italic", marginBottom:16, lineHeight:1.5}}>
            This is what God has done in your life.
          </div>
        )}
        <div className="moods" style={{marginBottom:16}}>
          {[["all","All"],["devotion","Devotions"],["prayer","Prayers"],["answered",`Answered${answeredCount?` (${answeredCount})`:""}`]].map(([id,lb]) => (
            <div key={id} className={`mood-chip${journeyFilter===id?" sel":""}`} onClick={() => setJourneyFilter(id)}>{lb}</div>
          ))}
        </div>
        <div className="ft-card">
          {filteredJourney.length === 0 ? (
            <div style={{textAlign:"center",color:"var(--text-faint)",padding:"20px 0",fontStyle:"italic"}}>
              {journeyFilter === "answered" ? "No answered prayers recorded yet." : "Nothing recorded here yet."}
            </div>
          ) : filteredJourney.map(item => (
            <div key={`${item.kind}-${item.id || item.date}`} className="entry">
              <div className="entry-dot" style={item.kind==="answered" ? {background:"var(--sage)", boxShadow:"0 0 0 4px var(--sage-soft)"} : undefined} />
              <div style={{flex:1}}>
                {item.kind === "devotion" ? (
                  <>
                    <div className="entry-date">
                      📖 Devotion · {item.date}{item.time && <span style={{color:"var(--text-faint)"}}> · {item.time}</span>}
                      {item.passage && <span style={{color:"var(--accent-strong)"}}> · {item.passage}</span>}
                    </div>
                    <div className="entry-mood">{item.mood}</div>
                    <div className="entry-note">{item.note}</div>
                  </>
                ) : (
                  <>
                    <div className="entry-date">
                      {item.kind==="answered" ? "✦ Answered Prayer" : "🙏 Prayer"} · {item.category}{item.date && <span style={{color:"var(--text-faint)"}}> · {item.date}</span>}
                    </div>
                    <div className="entry-note">{item.text}</div>
                    {item.scripture && <div className="entry-mood" style={{marginTop:4}}>{item.scripture}</div>}
                    {item.kind==="answered" && item.answeredNote && (
                      <div style={{fontSize:13,color:"var(--sage)",fontStyle:"italic",marginTop:6,lineHeight:1.5}}>"{item.answeredNote}"</div>
                    )}
                  </>
                )}
              </div>
            </div>
          ))}
        </div>
      </>
    );
  }

  // ── PROGRESS ──────────────────────────────────────────
  if (screen === "progress") {
    const pct = Math.min(Math.round((uniqueDays/30)*100), 100);
    const moodMap = {};
    entries.forEach(e => { moodMap[e.mood] = (moodMap[e.mood]||0)+1; });
    const topMood = Object.entries(moodMap).sort((a,b)=>b[1]-a[1])[0];
    return renderShell(
      <>
        <div className="ft-card">
          <div className="ft-card-title">Monthly Goal — 30 Days</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--text-tertiary)"}}>
            <span>{uniqueDays} days logged</span><span>{pct}%</span>
          </div>
          <div className="prog-wrap"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:16}}>
          {[{l:"Day Streak",v:streak},{l:"Total Entries",v:entries.length},{l:"Top Mood",v:topMood?topMood[0].split(" ")[0]:"—"},{l:"Fellowship",v:user.fellowship||"—"}].map(s => (
            <div key={s.l} className="stat-box">
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:23,color:"var(--accent-strong)",fontWeight:700}}>{s.v}</div>
              <div className="stat-label">{s.l}</div>
            </div>
          ))}
        </div>
        <div className="ft-card">
          <div className="ft-card-title">30-Day Activity</div>
          <div className="heat-grid">
            {Array.from({length:30},(_,i) => {
              const d = new Date(); d.setDate(d.getDate() - (29-i));
              const ds = d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
              return <div key={i} className={`heat-cell${entries.some(e=>e.date===ds)?" done":""}`} />;
            })}
          </div>
        </div>
        <div className="ft-verse" style={{padding:"20px 18px"}}>
          <div style={{fontSize:11,color:"var(--text-tertiary)",letterSpacing:2,textTransform:"uppercase",marginBottom:9,fontWeight:600}}>Encouragement</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontStyle:"italic",fontWeight:500,color:"var(--text-primary)",lineHeight:1.5}}>"He who began a good work in you will carry it on to completion."</div>
          <div className="ft-verse-ref" style={{marginTop:9}}>— Philippians 1:6</div>
        </div>
      </>
    );
  }

  // ── SETTINGS ──────────────────────────────────────────
  if (screen === "settings") return renderShell(
    <>
      <div className="ft-card">
        <div className="ft-card-title">Appearance</div>
        <div className="theme-toggle-row">
          <div className={`theme-toggle-btn${theme==="light"?" sel":""}`} onClick={() => setTheme("light")}>
            <span className="tt-ic">☀️</span>Light
          </div>
          <div className={`theme-toggle-btn${theme==="dark"?" sel":""}`} onClick={() => setTheme("dark")}>
            <span className="tt-ic">🌙</span>Dark
          </div>
        </div>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Edit Profile</div>
        <div className="ft-field">
          <label className="ft-label">Your Name</label>
          <input className="ft-input" value={user.name} onChange={e => setUser(u => ({...u, name: e.target.value}))} />
        </div>
        <div className="ft-field" style={{marginBottom:0}}>
          <label className="ft-label">Fellowship / Church</label>
          <input className="ft-input" value={user.fellowship} onChange={e => setUser(u => ({...u, fellowship: e.target.value}))} placeholder="e.g. Eklesia" />
        </div>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Daily Reminder</div>
        {PRESETS.map(t => (
          <button key={t} className={`time-btn${rTime===t?" sel":""}`} onClick={() => { setRTime(t); showT("Reminder time updated ✦"); }}>
            {t}{rTime===t && <span>✦</span>}
          </button>
        ))}
        <div className="ft-field" style={{marginTop:10, marginBottom:0}}>
          <label className="ft-label">Custom time</label>
          <input type="time" className="ft-input" onChange={e => { setRTime(e.target.value); showT("Reminder time updated ✦"); }} />
        </div>
        <p style={{fontSize:12,color:"var(--text-tertiary)",lineHeight:1.5,marginTop:10}}>
          Push reminders currently work best on Chrome for Android. iPhone support is limited by Safari's rules for installed web apps.
        </p>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Leadership</div>
        <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:12}}>
          View who's staying consistent across the fellowship.
        </p>
        <button className="ft-btn ghost" onClick={openDashboard}>👁️ View Leader Dashboard</button>
      </div>

      {uid === PASTOR_UID && (
        <div className="ft-card">
          <div className="ft-card-title">Fellowship Goal</div>
          {fellowshipGoal && (
            <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:12}}>
              Current: <strong style={{color:"var(--text-primary)"}}>{fellowshipGoal.label}</strong> — {fellowshipGoal.currentCount||0} of {fellowshipGoal.targetCount}
            </p>
          )}
          <div className="ft-field">
            <label className="ft-label">Goal Name</label>
            <input className="ft-input" placeholder="e.g. 500 Devotions This Month" value={goalLabelInput} onChange={e => setGoalLabelInput(e.target.value)} />
          </div>
          <div className="ft-field" style={{marginBottom:10}}>
            <label className="ft-label">Target Count</label>
            <input type="number" min="1" className="ft-input" placeholder="e.g. 500" value={goalTargetInput} onChange={e => setGoalTargetInput(e.target.value)} />
          </div>
          <button className="ft-btn ghost" onClick={setFellowshipGoal}>🎯 {fellowshipGoal ? "Start a New Goal" : "Set Fellowship Goal"}</button>
          {fellowshipGoal && (
            <p style={{fontSize:12,color:"var(--text-tertiary)",lineHeight:1.5,marginTop:8}}>
              Starting a new goal resets the count to zero — individual entries stay private either way.
            </p>
          )}
        </div>
      )}

      <div className="ft-card">
        <div className="ft-card-title">Mentorship</div>

        {!user.isMentor ? (
          <>
            <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:12}}>
              Register as a mentor to walk alongside others and see their consistency — only for those who choose to connect with you.
            </p>
            <button className="ft-btn ghost" onClick={becomeMentor}>🎓 Register as a Mentor</button>
          </>
        ) : (
          <>
            <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:10}}>
              Share this code with those you mentor:
            </p>
            <div className="time-btn sel" style={{justifyContent:"center", fontSize:20, letterSpacing:4, fontFamily:"'Cormorant Garamond',serif", fontWeight:700, cursor:"default"}}>
              {user.mentorCode}
            </div>
            <button className="ft-btn ghost" onClick={copyMentorCode}>📋 Copy Code</button>
            <button className="ft-btn ghost" onClick={openMentees}>👥 View My Mentees</button>
          </>
        )}

        <div className="divider" />

        {user.mentorUid ? (
          <>
            <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:12}}>
              You're connected to <strong style={{color:"var(--text-primary)"}}>{user.mentorName}</strong> as your mentor.
            </p>
            <button className="ft-btn ghost" style={{color:"var(--error)"}} onClick={unlinkMentor}>Disconnect from Mentor</button>
          </>
        ) : (
          <>
            <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:10}}>
              Have a mentor? Enter their code to connect:
            </p>
            <div className="ft-field" style={{marginBottom:10}}>
              <input className="ft-input" placeholder="e.g. K3F9XZ" value={mentorCodeInput} onChange={e => setMentorCodeInput(e.target.value)} autoCapitalize="characters" />
            </div>
            <button className="ft-btn ghost" onClick={linkToMentor}>🔗 Connect to Mentor</button>
          </>
        )}
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Your Data</div>
        <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5,marginBottom:12}}>
          {cloudReady
            ? "Your entries sync to the shared fellowship database and are visible in the Leader Dashboard."
            : "Cloud sync unavailable right now — entries are saved on this device only."}
        </p>
        <button className="ft-btn ghost" style={clearConfirm ? {borderColor:"var(--error)", color:"var(--error)"} : undefined} onClick={handleClearData}>
          {clearConfirm ? "Tap again to confirm — cannot be undone" : "🗑️ Clear All Entries"}
        </button>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">About Faith Tracker</div>
        <p style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.6}}>
          A daily devotion and prayer journal built to help believers stay consistent in fellowship with the Holy Spirit — one reflection, one prayer at a time.
        </p>
        <div style={{fontSize:11,color:"var(--text-faint)",marginTop:10,letterSpacing:1}}>Version 4.1 · Scripture Memory</div>
      </div>

      <button className="ft-btn" onClick={shareApp}>📤 Share Faith Tracker</button>
    </>
  );

  // ── SCRIPTURE MEMORY HUB ────────────────────────────────
  if (screen === "scripture") return renderShell(
    <>
      <button className="ft-btn" onClick={() => setScreen("scripturesave")}>✦ Save a Verse</button>
      <div className="ft-card" style={{marginTop:16}}>
        {scriptures.length === 0 ? (
          <div style={{textAlign:"center",color:"var(--text-faint)",padding:"20px 0",fontStyle:"italic"}}>
            No verses saved yet. Start hiding God's word in your heart.
          </div>
        ) : scriptures.map(v => (
          <div key={v.id} className="entry" style={{cursor:"pointer"}} onClick={() => openPractice(v)}>
            <div className="entry-dot" />
            <div style={{flex:1}}>
              <div className="entry-date">{v.reference} · {familiarityLabel(v.familiarity || 0)}</div>
              <div className="entry-note">{v.text}</div>
              <div className="prog-wrap" style={{marginTop:8}}><div className="prog-fill" style={{width:`${v.familiarity||0}%`}} /></div>
            </div>
          </div>
        ))}
      </div>
    </>
  );

  // ── SAVE A VERSE ────────────────────────────────────────
  if (screen === "scripturesave") return renderShell(
    <>
      <div className="ft-card">
        <div className="ft-card-title">Reference</div>
        <input className="ft-input" placeholder="e.g. Psalm 119:11" value={scriptureRef} onChange={e => setScriptureRef(e.target.value)} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Verse Text</div>
        <textarea className="ft-input" placeholder="Type the verse, word for word..." value={scriptureText} onChange={e => setScriptureText(e.target.value)} rows={5} />
      </div>
      <button className="ft-btn" onClick={submitScripture}>Save Verse ✦</button>
    </>
  );

  // ── PRACTICE A VERSE ────────────────────────────────────
  if (screen === "scripturepractice" && practiceVerse) {
    const seed = practiceVerse.reference.split("").reduce((s,c) => s + c.charCodeAt(0), 0);
    const masked = maskVerseText(practiceVerse.text, practiceVerse.familiarity || 0, seed);
    return renderShell(
      <>
        <div className="ft-verse">
          <div className="glow-dot" />
          <div className="ft-verse-text">{revealed ? practiceVerse.text : masked}</div>
          <div className="ft-verse-ref">— {practiceVerse.reference}</div>
        </div>
        {!revealed ? (
          <button className="ft-btn" onClick={() => setRevealed(true)}>Reveal Verse ✦</button>
        ) : (
          <>
            <div style={{textAlign:"center", color:"var(--text-secondary)", marginBottom:14, fontSize:15}}>How did that go?</div>
            <button className="ft-btn ghost" onClick={() => ratePractice("help")}>😅 Needed Help</button>
            <button className="ft-btn ghost" onClick={() => ratePractice("good")}>👍 Got It</button>
            <button className="ft-btn" onClick={() => ratePractice("great")}>🎯 Nailed It</button>
          </>
        )}
      </>
    );
  }

  // ── LEADER DASHBOARD ──────────────────────────────────
  if (screen === "dashboard") return renderShell(
    <div className="ft-card">
      <div className="ft-card-title">Fellowship Consistency</div>
      {dashData === null ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"var(--text-tertiary)"}}>Loading fellowship data...</div>
      ) : dashData.length === 0 ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"var(--text-faint)",fontStyle:"italic"}}>No members have logged yet.</div>
      ) : dashData.map((m, i) => (
        <div key={i} className="entry">
          <div className="entry-dot" />
          <div style={{flex:1}}>
            <div className="entry-date">{m.name}{m.fellowship && <span style={{color:"var(--text-faint)"}}> · {m.fellowship}</span>}</div>
            <div className="entry-mood">🔥 {m.streak} day streak · {m.totalEntries} total entries</div>
            <div className="entry-note">Last logged: {m.lastDate || "Never"}</div>
          </div>
        </div>
      ))}
    </div>
  );

  // ── MY MENTEES ────────────────────────────────────────
  if (screen === "mentees") return renderShell(
    <div className="ft-card">
      <div className="ft-card-title">Those You're Mentoring</div>
      {menteeData === null ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"var(--text-tertiary)"}}>Loading...</div>
      ) : menteeData.length === 0 ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"var(--text-faint)",fontStyle:"italic"}}>
          No one has connected to you as their mentor yet. Share your code from Settings.
        </div>
      ) : menteeData.map((m, i) => (
        <div key={i} className="entry">
          <div className="entry-dot" style={m.lastDate === todayStr() ? {background:"var(--sage)", boxShadow:"0 0 0 4px var(--sage-soft)"} : undefined} />
          <div style={{flex:1}}>
            <div className="entry-date">
              {m.name}{m.fellowship && <span style={{color:"var(--text-faint)"}}> · {m.fellowship}</span>}
              {m.lastDate === todayStr() && <span style={{color:"var(--sage)"}}> · ✨ Logged today</span>}
            </div>
            <div className="entry-mood">🔥 {m.streak} day streak · {m.totalEntries} total entries</div>
            <div className="entry-note">Last logged: {m.lastDate || "Never"}</div>

            <div style={{display:"flex", gap:8, marginTop:10, flexWrap:"wrap"}}>
              {NUDGE_EMOJIS.map(em => (
                <button key={em} className="ft-btn ghost" style={{width:"auto", padding:"7px 13px", fontSize:16, marginTop:0}} onClick={() => sendNudge(m, "emoji", em)}>{em}</button>
              ))}
              <button className="ft-btn ghost" style={{width:"auto", padding:"7px 13px", fontSize:13, marginTop:0}} onClick={() => setNudgingMentee(nudgingMentee === i ? null : i)}>💬 Encourage</button>
            </div>

            {nudgingMentee === i && (
              <div className="moods" style={{marginTop:10}}>
                {NUDGE_MESSAGES.map(msg => (
                  <div key={msg} className="mood-chip" onClick={() => sendNudge(m, "message", msg)}>{msg}</div>
                ))}
              </div>
            )}
          </div>
        </div>
      ))}
    </div>
  );

  return null;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(r  => console.log("[FaithTracker] SW ready:", r.scope))
      .catch(e => console.warn("[FaithTracker] SW failed:", e));
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
