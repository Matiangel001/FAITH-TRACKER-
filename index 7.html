const load = (k, fb) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fb; } catch { return fb; } };
const save = (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const timeStr  = () => new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });

const calcStreakFromDates = (dateStrings) => {
  const days = [...new Set(dateStrings)].sort((a,b) => new Date(b) - new Date(a));
  if (!days.length) return 0;
  let s = 0, check = new Date();
  check.setHours(0,0,0,0);
  for (const d of days) {
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diff = (check - dd) / 86400000;
    if (diff <= 1) { s++; check = dd; } else break;
  }
  return s;
};

        } else {
          setScreen("onboard");
        }
      } catch (e) { setScreen("onboard"); }
    });
    return () => unsub && unsub();
  }, []);

  const handleAuthSubmit = async () => {
    setAuthError("");
    if (!authEmail.trim() || !authPass) { setAuthError("Enter your email and password."); return; }
    if (authPass.length < 6) { setAuthError("Password must be at least 6 characters."); return; }
    setAuthBusy(true);
    try {
      if (authMode === "signup") await window.FB.signUp(authEmail.trim(), authPass);
      else await window.FB.signIn(authEmail.trim(), authPass);
      setAuthPass("");
    } catch (e) {
      const map = {
        "auth/email-already-in-use": "That email already has an account — try Sign In instead.",
        "auth/invalid-email": "That email address doesn't look right.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/user-not-found": "No account found with that email.",
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-credential": "Incorrect email or password.",
      };
      setAuthError(map[e.code] || "Something went wrong. Please try again.");
    }
    setAuthBusy(false);
  };

  const handlePasswordReset = async () => {
    if (!authEmail.trim()) { setAuthError("Enter your email above first, then tap this again."); return; }
    try {
      await window.FB.resetPassword(authEmail.trim());
      showT("Password reset email sent ✦");
    } catch (e) { setAuthError("Couldn't send reset email — check the address."); }
  };

  const handleLogOut = async () => {
    setDrawerOpen(false);
    try { await window.FB.signOutUser(); } catch (e) {}
  };



  // ── FIREBASE: load this user's entries ─────────────────
  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, getDocs } = window.FB;
    (async () => {
      try {
        const q = query(collection(db, "entries"), where("uid", "==", uid));
        const snap = await getDocs(q);
        const cloudEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cloudEntries.sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));
        setEntries(cloudEntries);
      } catch (e) { console.warn("[FaithTracker] failed to load entries", e); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, getDocs } = window.FB;
    (async () => {
      try {
        const q = query(collection(db, "prayers"), where("uid", "==", uid));
        const snap = await getDocs(q);
        const cloudPrayers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cloudPrayers.sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));
        setPrayers(cloudPrayers);
      } catch (e) { console.warn("[FaithTracker] failed to load prayers", e); }
    })();
  }, [uid]);

  // Keep the shared "members" record up to date so the leader dashboard can find this person
  useEffect(() => {
    if (!uid || !user.name || !window.FB) return;
    const { db, doc, setDoc } = window.FB;
    setDoc(doc(db, "members", uid), { name: user.name, fellowship: user.fellowship || "" }, { merge: true }).catch(() => {});
  }, [uid, user.name, user.fellowship]);

  useEffect(() => {
    const h = e => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
    window.addEventListener("beforeinstallprompt", h);
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);

  const handleInstall = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    if (r.outcome === "accepted") { setShowInstall(false); showT("App installed ✦"); }
    setDeferredPrompt(null);
  };

  const showT = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const todaysEntries = entries.filter(e => e.date === todayStr());
  const uniqueDays = [...new Set(entries.map(e => e.date))].length;
  const streak = calcStreakFromDates(entries.map(e => e.date));

  const submitLog = async () => {
    if (!mood)    return showT("Please select a mood ✦");
    if (!reflect) return showT("Please write a reflection ✦");
    const tempId = "local-" + Date.now();
    const newEntry = { date: todayStr(), time: timeStr(), mood, passage, note: reflect, uid, name: user.name, createdAtMs: Date.now() };
    setEntries(prev => [{ id: tempId, ...newEntry }, ...prev]);
    setMood(""); setPassage(""); setReflect("");
    showT("Devotion logged ✦ Well done!");
    setScreen("home");
    if (uid && window.FB) {
      try {
        const { db, collection, addDoc } = window.FB;
        const ref = await addDoc(collection(db, "entries"), newEntry);
        setEntries(prev => prev.map(e => e.id === tempId ? { ...e, id: ref.id } : e));
      } catch (err) { showT("Saved locally — will sync when online"); }
    }
  };

  const submitPrayer = async () => {
    if (!prayerCategory) return showT("Please choose a category ✦");
    if (!prayerText.trim()) return showT("Please write what you're praying for ✦");
    const hrs = parseFloat(prayerHours);
    if (!prayerHours || isNaN(hrs) || hrs < 1) return showT("Please log at least 1 hour ✦");
    const tempId = "local-" + Date.now();
    const newPrayer = {
      category: prayerCategory, text: prayerText, scripture: prayerScripture, hours: hrs,
      status: "praying", answeredNote: "", date: todayStr(), time: timeStr(),
      uid, name: user.name, createdAtMs: Date.now(),
    };
    setPrayers(prev => [{ id: tempId, ...newPrayer }, ...prev]);
    setPrayerCategory(""); setPrayerText(""); setPrayerScripture(""); setPrayerHours("");
    showT("Prayer added ✦");
    setScreen("prayer");
    if (uid && window.FB) {
      try {
        const { db, collection, addDoc } = window.FB;
        const ref = await addDoc(collection(db, "prayers"), newPrayer);
        setPrayers(prev => prev.map(p => p.id === tempId ? { ...p, id: ref.id } : p));
      } catch (err) { showT("Saved locally — will sync when online"); }
    }
  };

  const markAnswered = async (prayerId) => {
    const note = window.prompt("How did God answer this? (optional)") || "";
    setPrayers(prev => prev.map(p => p.id === prayerId ? { ...p, status: "answered", answeredNote: note } : p));
    showT("Marked as answered ✦ Praise God!");
    if (uid && window.FB && prayerId && !String(prayerId).startsWith("local-")) {
      try {
        const { db, doc, updateDoc } = window.FB;
        await updateDoc(doc(db, "prayers", prayerId), { status: "answered", answeredNote: note });
      } catch (e) {}
    }
  };

  const shareApp = async () => {
    const url = window.location.href;
    try {
      if (navigator.share) await navigator.share({ title: "Faith Tracker", text: "Join me in daily devotion with Faith Tracker 🕊️", url });
      else if (navigator.clipboard) { await navigator.clipboard.writeText(url); showT("Link copied ✦"); }
    } catch (e) {}
    setDrawerOpen(false);
  };

  const handleClearData = async () => {
    if (!clearConfirm) { setClearConfirm(true); setTimeout(() => setClearConfirm(false), 3000); return; }
    setClearConfirm(false);
    const toDelete = entries.filter(e => e.id && !String(e.id).startsWith("local-"));
    setEntries([]);
    showT("All entries cleared");
    if (uid && window.FB && toDelete.length) {
      try {
        const { db, doc, deleteDoc } = window.FB;
        await Promise.all(toDelete.map(e => deleteDoc(doc(db, "entries", e.id))));
      } catch (e) {}
    }
  };

  const openDashboard = async () => {
    const pin = window.prompt("Enter leader PIN:");
    if (pin === null) return;
    if (pin !== LEADER_PIN) { showT("Incorrect PIN"); return; }
    setDrawerOpen(false);
    setScreen("dashboard");
    setDashData(null);
    if (!window.FB) { setDashData([]); return; }
    try {
      const { db, collection, getDocs } = window.FB;
      const [membersSnap, entriesSnap] = await Promise.all([
        getDocs(collection(db, "members")),
        getDocs(collection(db, "entries")),
      ]);
      const members = membersSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
      const allEntries = entriesSnap.docs.map(d => d.data());
      const byUid = {};
      members.forEach(m => { byUid[m.uid] = { ...m, entries: [] }; });
      allEntries.forEach(e => { if (!byUid[e.uid]) byUid[e.uid] = { name: e.name || "Unnamed", fellowship: "", entries: [] }; byUid[e.uid].entries.push(e); });
      const rows = Object.values(byUid).map(m => {
        const days = [...new Set(m.entries.map(e => e.date))];
        const sorted = days.sort((a,b) => new Date(b) - new Date(a));
        return {
          name: m.name || "Unnamed",
          fellowship: m.fellowship || "",
          totalEntries: m.entries.length,
          streak: calcStreakFromDates(days),
          lastDate: sorted[0] || null,
        };
      }).sort((a,b) => b.streak - a.streak || b.totalEntries - a.totalEntries);
      setDashData(rows);
    } catch (e) {
      console.warn("[FaithTracker] dashboard load failed", e);
      setDashData([]);
    }
  };

  const TITLES = { home:"Home", log:"Log Devotion", history:"Journal", progress:"Progress", settings:"Settings", dashboard:"Leader Dashboard", prayer:"Prayer", prayerlog:"Add Prayer" };
  const SUBS = {
    home: todaysEntries.length > 0 ? `${todaysEntries.length} logged today ✦` : "Daily Devotion Journal",
    log: todayStr(),
    history: `${entries.length} total entr${entries.length===1?"y":"ies"}`,
    progress: "Your spiritual growth",
    settings: "Customize your experience",
    dashboard: "Fellowship consistency",
    prayer: `${prayers.filter(p=>p.status==="praying").length} active · ${prayers.filter(p=>p.status==="answered").length} answered`,
    prayerlog: "What's on your heart?",
  };

  const renderShell = (content) => (
    <div className="ft-root">
      {toast && <div className="ft-toast">{toast}</div>}

      <div className="ft-topbar">
        <button className="topbar-icon-btn" onClick={() => setDrawerOpen(true)} aria-label="Menu">☰</button>
        <div className="topbar-title-wrap">
          <div className="topbar-title">{TITLES[screen]}</div>
          <div className="topbar-sub">{SUBS[screen]}</div>
        </div>
        <div className="topbar-right">
          <div className="topbar-streak">🔥 {streak}</div>
          <button className={`topbar-icon-btn${screen==="settings"?" active":""}`} onClick={() => setScreen("settings")} aria-label="Settings">⚙️</button>
        </div>
      </div>

      {drawerOpen && (
        <>
          <div className="drawer-overlay" onClick={() => setDrawerOpen(false)} />
          <div className="drawer-panel">
            <div className="drawer-header">
              <div className="drawer-avatar">🕊️</div>
              <div>
                <div className="drawer-name">{user.name || "Friend"}</div>
                <div className="drawer-fellowship">{user.fellowship || "Faith Tracker"}</div>
              </div>
              <button className="drawer-close" onClick={() => setDrawerOpen(false)}>✕</button>
            </div>
            <div className="drawer-menu">
              {NAV_ITEMS.map(([ic,lb,id]) => (
                <button key={id} className={`drawer-item${screen===id?" active":""}`} onClick={() => { setScreen(id); setDrawerOpen(false); }}>
                  <span className="di-ic">{ic}</span>{lb}
                </button>
              ))}
              <div className="drawer-divider" />
              <button className={`drawer-item${screen==="settings"?" active":""}`} onClick={() => { setScreen("settings"); setDrawerOpen(false); }}>
                <span className="di-ic">⚙️</span>Settings
              </button>
              <button className="drawer-item" onClick={openDashboard}>
                <span className="di-ic">👁️</span>Leader Dashboard
              </button>
              <button className="drawer-item" onClick={shareApp}>
                <span className="di-ic">📤</span>Share App
              </button>
              <div className="drawer-divider" />
              <button className="drawer-item" onClick={handleLogOut} style={{color:"#e0876a"}}>
                <span className="di-ic">🚪</span>Log Out
              </button>
            </div>
            <div className="drawer-footer">{user.name ? `Signed in as ${user.name}` : "Faith Tracker · Walk daily with the Spirit"}</div>
          </div>
        </>
      )}

      <div className="ft-scroll screen-fade" key={screen}>{content}</div>

      <nav className="ft-nav">
        {NAV_ITEMS.map(([ic,lb,id]) => (
          <button key={id} className={`ft-nav-btn${screen===id?" active":""}`} onClick={() => setScreen(id)}>
            <span className="ic">{ic}</span>{lb}
          </button>
        ))}
      </nav>
    </div>
  );

  // ── LOADING SPLASH ─────────────────────────────────────
  if (screen === "loading") return (
    <div className="ft-root">
      <div style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
        <div className="glow-dot" />
        <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:"rgba(232,213,176,.5)"}}>Faith Tracker</div>
      </div>
    </div>
  );

  // ── AUTH (sign in / create account) ────────────────────
  if (screen === "auth") return (
    <div className="ft-root">
      {toast && <div className="ft-toast">{toast}</div>}
      <div className="ft-header"><div className="ft-logo">Faith Tracker</div></div>
      <div className="ft-scroll">
        <div className="onboard">
          <div className="glow-dot" />
          <div className="ob-step">{authMode === "signup" ? "Create Account" : "Welcome Back"}</div>
          <div className="ob-title">{authMode === "signup" ? "Start your journey" : "Continue your journey"}</div>
          <div className="ob-sub">
            {authMode === "signup"
              ? "Create an account so your devotions and prayers follow you to any device."
              : "Sign in to pick up right where you left off."}
          </div>

          <div className="ft-field">
            <label className="ft-label">Email</label>
            <input className="ft-input" type="email" autoCapitalize="none" placeholder="you@example.com" value={authEmail} onChange={e => setAuthEmail(e.target.value)} />
          </div>
          <div className="ft-field">
            <label className="ft-label">Password</label>
            <input className="ft-input" type="password" placeholder="At least 6 characters" value={authPass} onChange={e => setAuthPass(e.target.value)} />
          </div>

          {authError && (
            <div style={{fontSize:13, color:"#e0876a", marginBottom:14, lineHeight:1.5}}>{authError}</div>
          )}

          <button className="ft-btn" onClick={handleAuthSubmit} disabled={authBusy}>
            {authBusy ? "Please wait..." : authMode === "signup" ? "Create Account ✦" : "Sign In ✦"}
          </button>

          {authMode === "signin" && (
            <button className="ft-btn ghost" style={{fontSize:13, marginTop:8}} onClick={handlePasswordReset}>Forgot password?</button>
          )}

          <div className="divider" />

          <button className="ft-btn ghost" onClick={() => { setAuthMode(m => m === "signup" ? "signin" : "signup"); setAuthError(""); }}>
            {authMode === "signup" ? "Already have an account? Sign In" : "New here? Create an Account"}
          </button>
        </div>
      </div>
    </div>
  );

  // ── ONBOARDING ─────────────────────────────────────────
  if (screen === "onboard") return (
    <div className="ft-root">
      {toast && <div className="ft-toast">{toast}</div>}
      <div className="ft-header"><div className="ft-logo">Faith Tracker</div></div>
      <div className="ft-scroll">
        <div className="onboard">
          <div className="glow-dot" />
          {step === 1 && (
            <>
              <div className="ob-step">Welcome</div>
              <div className="ob-title">Walk daily with the Holy Spirit</div>
              <div className="ob-sub">Log your devotions, write reflections, and build an unbreakable daily habit with God.</div>
              <div className="ft-field">
                <label className="ft-label">Your Name</label>
                <input className="ft-input" placeholder="e.g. Victor" value={user.name} onChange={e => setUser(u => ({...u, name: e.target.value}))} />
              </div>
              <div className="ft-field">
                <label className="ft-label">Fellowship / Church (optional)</label>
                <input className="ft-input" placeholder="e.g. Eklesia" value={user.fellowship} onChange={e => setUser(u => ({...u, fellowship: e.target.value}))} />
              </div>
              <button className="ft-btn" onClick={() => { if (!user.name.trim()) return showT("Please enter your name"); setStep(2); }}>Continue →</button>
            </>
          )}
          {step === 2 && (
            <>
              <div className="ob-step">Step 2 of 2</div>
              <div className="ob-title">Set your reminder time</div>
              <div className="ob-sub">When should we nudge you for your daily devotion?</div>
              {PRESETS.map(t => (
                <button key={t} className={`time-btn${rTime===t?" sel":""}`} onClick={() => setRTime(t)}>{t} {rTime===t && <span>✦</span>}</button>
              ))}
              <div className="divider" />
              <div className="ft-field">
                <label className="ft-label">Or set a custom time</label>
                <input type="time" className="ft-input" onChange={e => setRTime(e.target.value)} />
              </div>
              <button className="ft-btn" onClick={() => { setScreen("home"); showT("Welcome, " + user.name + " ✦"); }}>Start My Journey ✦</button>
              <button className="ft-btn ghost" onClick={() => setStep(1)}>← Back</button>
            </>
          )}
        </div>
      </div>
    </div>
  );

  // ── HOME ──────────────────────────────────────────────
  if (screen === "home") {
    const hour = new Date().getHours();
    const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    return renderShell(
      <>
        {showInstall && (
          <div className="install-banner">
            <p>Install Faith Tracker on your home screen.</p>
            <button className="install-btn" onClick={handleInstall}>Install</button>
          </div>
        )}
        <div style={{marginBottom:14, fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:"#e8d5b0"}}>
          {greet}, {user.name} 🕊️
        </div>
        <div className="ft-verse">
          <div className="glow-dot" />
          <div className="ft-verse-text">"{verse.text}"</div>
          <div className="ft-verse-ref">— {verse.ref}</div>
        </div>
        <div className="stats-row">
          <div className="stat-box"><div className="stat-num">{streak}</div><div className="stat-label">Day Streak</div></div>
          <div className="stat-box"><div className="stat-num">{uniqueDays}</div><div className="stat-label">Days Logged</div></div>
          <div className="stat-box"><div className="stat-num">{entries.length}</div><div className="stat-label">Total Entries</div></div>
        </div>
        <button className="ft-btn" onClick={() => setScreen("log")}>✦ Log a Devotion Entry</button>
        <button className="ft-btn ghost" onClick={() => setScreen("history")}>View Journal History</button>
        <div className="ft-card" style={{marginTop:14}}>
          <div className="ft-card-title">This Week</div>
          <div className="week-grid">
            {WDAYS.map((d,i) => {
              const day = new Date(); day.setDate(day.getDate() - (new Date().getDay() - i));
              const ds = day.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
              return <div key={i} className={`week-cell${entries.some(e=>e.date===ds)?" done":""}`}>{d}</div>;
            })}
          </div>
        </div>
      </>
    );
  }

  // ── LOG ───────────────────────────────────────────────
  if (screen === "log") return renderShell(
    <>
      {todaysEntries.length > 0 && (
        <div className="today-badge">✦ {todaysEntries.length} entr{todaysEntries.length===1?"y":"ies"} today — add another</div>
      )}
      <div className="ft-card">
        <div className="ft-card-title">How are you feeling?</div>
        <div className="moods">
          {MOODS.map(m => <div key={m} className={`mood-chip${mood===m?" sel":""}`} onClick={() => setMood(m)}>{m}</div>)}
        </div>
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Bible Passage</div>
        <input className="ft-input" placeholder="e.g. John 3:16, Psalms 23..." value={passage} onChange={e => setPassage(e.target.value)} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Your Reflection</div>
        <textarea className="ft-input" placeholder="What did the Holy Spirit speak to you today?" value={reflect} onChange={e => setReflect(e.target.value)} rows={5} />
      </div>
      <button className="ft-btn" onClick={submitLog}>Save Entry ✦</button>
    </>
  );

  // ── PRAYER HUB ──────────────────────────────────────────
  if (screen === "prayer") {
    const filtered = prayers.filter(p => prayerFilter === "all" ? true : p.status === prayerFilter);
    const totalHours = prayers.reduce((sum, p) => sum + (Number(p.hours) || 0), 0);
    return renderShell(
      <>
        <button className="ft-btn" onClick={() => setScreen("prayerlog")}>🙏 Add Prayer Request</button>
        <div className="stats-row" style={{marginTop:14}}>
          <div className="stat-box"><div className="stat-num">{totalHours}</div><div className="stat-label">Hours Prayed</div></div>
          <div className="stat-box"><div className="stat-num">{prayers.filter(p=>p.status==="praying").length}</div><div className="stat-label">Active</div></div>
          <div className="stat-box"><div className="stat-num">{prayers.filter(p=>p.status==="answered").length}</div><div className="stat-label">Answered</div></div>
        </div>
        <div className="moods" style={{margin:"14px 0"}}>
          {[["praying","Praying"],["answered","Answered"],["all","All"]].map(([id,lb]) => (
            <div key={id} className={`mood-chip${prayerFilter===id?" sel":""}`} onClick={() => setPrayerFilter(id)}>{lb}</div>
          ))}
        </div>
        <div className="ft-card">
          {filtered.length === 0 ? (
            <div style={{textAlign:"center",color:"rgba(232,213,176,.32)",padding:"20px 0",fontStyle:"italic"}}>
              {prayerFilter === "answered" ? "No answered prayers recorded yet." : "Nothing logged here yet."}
            </div>
          ) : filtered.map(p => (
            <div key={p.id} className="entry">
              <div className="entry-dot" style={p.status==="answered" ? {background:"#7fae6a", boxShadow:"0 0 7px rgba(127,174,106,.55)"} : undefined} />
              <div style={{flex:1}}>
                <div className="entry-date">
                  {p.category}{p.date && <span style={{color:"rgba(201,146,42,.4)"}}> · {p.date}</span>}
                  {p.hours ? <span style={{color:"rgba(201,146,42,.55)"}}> · {p.hours} hr{p.hours==1?"":"s"}</span> : null}
                  {p.status==="answered" && <span style={{color:"#7fae6a"}}> · Answered ✦</span>}
                </div>
                <div className="entry-note">{p.text}</div>
                {p.scripture && <div className="entry-mood" style={{marginTop:4}}>{p.scripture}</div>}
                {p.status==="answered" && p.answeredNote && (
                  <div style={{fontSize:13,color:"rgba(127,174,106,.85)",fontStyle:"italic",marginTop:6,lineHeight:1.5}}>"{p.answeredNote}"</div>
                )}
                {p.status==="praying" && (
                  <button className="ft-btn ghost" style={{marginTop:10,padding:"8px 12px",fontSize:13}} onClick={() => markAnswered(p.id)}>✦ Mark as Answered</button>
                )}
              </div>
            </div>
          ))}
        </div>
      </>
    );
  }

  // ── ADD PRAYER ────────────────────────────────────────
  if (screen === "prayerlog") return renderShell(
    <>
      <div className="ft-card">
        <div className="ft-card-title">Category</div>
        <div className="moods">
          {PRAYER_CATEGORIES.map(c => (
            <div key={c} className={`mood-chip${prayerCategory===c?" sel":""}`} onClick={() => setPrayerCategory(c)}>{c}</div>
          ))}
        </div>
      </div>
      <div className="ft-card">
        <div className="ft-card-title">What are you praying for?</div>
        <textarea className="ft-input" placeholder="Write your prayer request..." value={prayerText} onChange={e => setPrayerText(e.target.value)} rows={4} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Scripture (optional)</div>
        <input className="ft-input" placeholder="e.g. Philippians 4:6-7" value={prayerScripture} onChange={e => setPrayerScripture(e.target.value)} />
      </div>
      <div className="ft-card">
        <div className="ft-card-title">Hours Spent in Prayer</div>
        <input type="number" min="1" step="0.5" className="ft-input" placeholder="Minimum 1 hour" value={prayerHours} onChange={e => setPrayerHours(e.target.value)} />
        <p style={{fontSize:12,color:"rgba(232,213,176,.4)",lineHeight:1.5,marginTop:8}}>
          Log the time you actually spent in prayer — minimum 1 hour per entry.
        </p>
      </div>
      <button className="ft-btn" onClick={submitPrayer}>Save Prayer ✦</button>
    </>
  );

  // ── HISTORY ───────────────────────────────────────────
  if (screen === "history") return renderShell(
    <div className="ft-card">
      <div className="ft-card-title">Devotion History</div>
      {entries.length === 0 ? (
        <div style={{textAlign:"center",color:"rgba(232,213,176,.32)",padding:"20px 0",fontStyle:"italic"}}>No entries yet. Log your first devotion today.</div>
      ) : entries.map(e => (
        <div key={e.id || e.date} className="entry">
          <div className="entry-dot" />
          <div style={{flex:1}}>
            <div className="entry-date">
              {e.date}{e.time && <span style={{color:"rgba(201,146,42,.4)"}}> · {e.time}</span>}
              {e.passage && <span style={{color:"rgba(201,146,42,.55)"}}> · {e.passage}</span>}
            </div>
            <div className="entry-mood">{e.mood}</div>
            <div className="entry-note">{e.note}</div>
          </div>
        </div>
      ))}
    </div>
  );

  // ── PROGRESS ──────────────────────────────────────────
  if (screen === "progress") {
    const pct = Math.min(Math.round((uniqueDays/30)*100), 100);
    const moodMap = {};
    entries.forEach(e => { moodMap[e.mood] = (moodMap[e.mood]||0)+1; });
    const topMood = Object.entries(moodMap).sort((a,b)=>b[1]-a[1])[0];
    return renderShell(
      <>
        <div className="ft-card">
          <div className="ft-card-title">Monthly Goal — 30 Days</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"rgba(232,213,176,.45)"}}>
            <span>{uniqueDays} days logged</span><span>{pct}%</span>
          </div>
          <div className="prog-wrap"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[{l:"Day Streak",v:streak},{l:"Total Entries",v:entries.length},{l:"Top Mood",v:topMood?topMood[0].split(" ")[0]:"—"},{l:"Fellowship",v:user.fellowship||"—"}].map(s => (
            <div key={s.l} className="stat-box">
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#c9922a",fontWeight:600}}>{s.v}</div>
              <div className="stat-label">{s.l}</div>
            </div>
          ))}
        </div>
        <div className="ft-card">
          <div className="ft-card-title">30-Day Activity</div>
          <div className="heat-grid">
            {Array.from({length:30},(_,i) => {
              const d = new Date(); d.setDate(d.getDate() - (29-i));
              const ds = d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
              return <div key={i} className={`heat-cell${entries.some(e=>e.date===ds)?" done":""}`} />;
            })}
          </div>
        </div>
        <div className="ft-verse" style={{padding:"18px 16px"}}>
          <div style={{fontSize:11,color:"rgba(232,213,176,.4)",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Encouragement</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,fontStyle:"italic",color:"#e8d5b0",lineHeight:1.5}}>"He who began a good work in you will carry it on to completion."</div>
          <div className="ft-verse-ref" style={{marginTop:8}}>— Philippians 1:6</div>
        </div>
      </>
    );
  }

  // ── SETTINGS ──────────────────────────────────────────
  if (screen === "settings") return renderShell(
    <>
      <div className="ft-card">
        <div className="ft-card-title">Edit Profile</div>
        <div className="ft-field">
          <label className="ft-label">Your Name</label>
          <input className="ft-input" value={user.name} onChange={e => setUser(u => ({...u, name: e.target.value}))} />
        </div>
        <div className="ft-field" style={{marginBottom:0}}>
          <label className="ft-label">Fellowship / Church</label>
          <input className="ft-input" value={user.fellowship} onChange={e => setUser(u => ({...u, fellowship: e.target.value}))} placeholder="e.g. Eklesia" />
        </div>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Daily Reminder</div>
        {PRESETS.map(t => (
          <button key={t} className={`time-btn${rTime===t?" sel":""}`} onClick={() => { setRTime(t); showT("Reminder time updated ✦"); }}>
            {t}{rTime===t && <span>✦</span>}
          </button>
        ))}
        <div className="ft-field" style={{marginTop:10, marginBottom:0}}>
          <label className="ft-label">Custom time</label>
          <input type="time" className="ft-input" onChange={e => { setRTime(e.target.value); showT("Reminder time updated ✦"); }} />
        </div>
        <p style={{fontSize:12,color:"rgba(232,213,176,.4)",lineHeight:1.5,marginTop:10}}>
          Push reminders currently work best on Chrome for Android. iPhone support is limited by Safari's rules for installed web apps.
        </p>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Leadership</div>
        <p style={{fontSize:13,color:"rgba(232,213,176,.55)",lineHeight:1.5,marginBottom:12}}>
          View who's staying consistent across the fellowship.
        </p>
        <button className="ft-btn ghost" onClick={openDashboard}>👁️ View Leader Dashboard</button>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">Your Data</div>
        <p style={{fontSize:13,color:"rgba(232,213,176,.55)",lineHeight:1.5,marginBottom:12}}>
          {cloudReady
            ? "Your entries sync to the shared fellowship database and are visible in the Leader Dashboard."
            : "Cloud sync unavailable right now — entries are saved on this device only."}
        </p>
        <button className="ft-btn ghost" style={clearConfirm ? {borderColor:"rgba(210,90,60,.5)", color:"#e0876a"} : undefined} onClick={handleClearData}>
          {clearConfirm ? "Tap again to confirm — cannot be undone" : "🗑️ Clear All Entries"}
        </button>
      </div>

      <div className="ft-card">
        <div className="ft-card-title">About Faith Tracker</div>
        <p style={{fontSize:13,color:"rgba(232,213,176,.55)",lineHeight:1.6}}>
          A daily devotion and prayer journal built to help believers stay consistent in fellowship with the Holy Spirit — one reflection, one prayer at a time.
        </p>
        <div style={{fontSize:11,color:"rgba(232,213,176,.3)",marginTop:10,letterSpacing:1}}>Version 3.1 · Prayer Log</div>
      </div>

      <button className="ft-btn" onClick={shareApp}>📤 Share Faith Tracker</button>
    </>
  );

  // ── LEADER DASHBOARD ──────────────────────────────────
  if (screen === "dashboard") return renderShell(
    <div className="ft-card">
      <div className="ft-card-title">Fellowship Consistency</div>
      {dashData === null ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"rgba(232,213,176,.4)"}}>Loading fellowship data...</div>
      ) : dashData.length === 0 ? (
        <div style={{textAlign:"center",padding:"24px 0",color:"rgba(232,213,176,.32)",fontStyle:"italic"}}>No members have logged yet.</div>
      ) : dashData.map((m, i) => (
        <div key={i} className="entry">
          <div className="entry-dot" />
          <div style={{flex:1}}>
            <div className="entry-date">{m.name}{m.fellowship && <span style={{color:"rgba(201,146,42,.4)"}}> · {m.fellowship}</span>}</div>
            <div className="entry-mood">🔥 {m.streak} day streak · {m.totalEntries} total entries</div>
            <div className="entry-note">Last logged: {m.lastDate || "Never"}</div>
          </div>
        </div>
      ))}
    </div>
  );

  return null;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(r  => console.log("[FaithTracker] SW ready:", r.scope))
      .catch(e => console.warn("[FaithTracker] SW failed:", e));
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
