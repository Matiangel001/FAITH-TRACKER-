<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Faith Tracker" />
  <meta name="theme-color" content="#4A6741" />
  <meta name="description" content="A daily devotion and prayer journal — walk consistently with the Holy Spirit" />
  <link rel="manifest" href="manifest.json" />
  <title>Faith Tracker</title>

  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }

    :root {
      --bg-base:        #F9F9F8;
      --surface:        #FFFFFF;
      --surface-alt:    #F3F4F6;
      --surface-border: #E5E7EB;
      --surface-line:   #E5E7EB;
      --text-primary:   #1F2937;
      --text-heading:   #1F2937;
      --text-secondary: #4B5563;
      --text-tertiary:  #6B7280;
      --text-faint:     #9CA3AF;
      --accent:         #4A6741;
      --accent-strong:  #4A6741;
      --accent-hover:   #3D5535;
      --accent-soft:    rgba(74,103,65,0.08);
      --accent-border:  rgba(74,103,65,0.32);
      --accent-on:      #FFFFFF;
      --sage:           #4A6741;
      --sage-soft:      rgba(74,103,65,0.08);
      --sage-border:    rgba(74,103,65,0.32);
      --error:          #B4432B;
      --nav-bg:         #FFFFFF;
      --topbar-bg:      #FFFFFF;
      --input-bg:       #FFFFFF;
      --shadow-card:    0 1px 3px rgba(0,0,0,0.05);
      --shadow-lift:    0 4px 16px rgba(0,0,0,0.12);
      --overlay:        rgba(17,24,39,0.45);
    }
    [data-theme="dark"] {
      --bg-base:        #111513;
      --surface:        #1A1F1C;
      --surface-alt:    #232925;
      --surface-border: #2F3732;
      --surface-line:   #2F3732;
      --text-primary:   #F3F4F6;
      --text-heading:   #F3F4F6;
      --text-secondary: #B6BDB8;
      --text-tertiary:  #939B96;
      --text-faint:     #6F7872;
      --accent:         #6E9462;
      --accent-strong:  #8DB381;
      --accent-hover:   #5F8554;
      --accent-soft:    rgba(110,148,98,0.14);
      --accent-border:  rgba(110,148,98,0.4);
      --accent-on:      #FFFFFF;
      --sage:           #8DB381;
      --sage-soft:      rgba(110,148,98,0.14);
      --sage-border:    rgba(110,148,98,0.4);
      --error:          #E0876A;
      --nav-bg:         #1A1F1C;
      --topbar-bg:      #1A1F1C;
      --input-bg:       #1A1F1C;
      --shadow-card:    0 1px 3px rgba(0,0,0,0.3);
      --shadow-lift:    0 8px 32px rgba(0,0,0,0.5);
      --overlay:        rgba(0,0,0,0.6);
    }

    body { background: var(--bg-base); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-primary); transition: background .3s ease, color .3s ease; }
    button, input, textarea { font-family: inherit; }

    /* ── SHELL ───────────────────────────────────────── */
    .ft-root { height: 100vh; display: flex; flex-direction: column; background: var(--bg-base); position: relative; overflow: hidden; color: var(--text-primary); }
    .ft-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; position: relative; z-index: 1; min-height: 0; }
    .ft-scroll::-webkit-scrollbar { display: none; }
    .ft-main { display: flex; flex-direction: column; gap: 28px; max-width: 900px; margin: 0 auto; width: 100%; }
    .ft-header + .ft-scroll > * { max-width: 560px; margin-left: auto; margin-right: auto; }

    .ft-header { padding: 22px 20px 16px; text-align: center; border-bottom: 1px solid var(--surface-border); background: var(--surface); position: relative; z-index: 1; flex-shrink: 0; }
    .ft-logo { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
    .ft-tagline { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

    .ft-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 16px 14px; border-bottom: 1px solid var(--surface-border); background: var(--topbar-bg); position: relative; z-index: 5; flex-shrink: 0; }
    .topbar-icon-btn { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-secondary); cursor: pointer; flex-shrink: 0; }
    .topbar-icon-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .topbar-title-wrap { flex: 1; text-align: center; overflow: hidden; padding: 0 4px; }
    .topbar-title { font-size: 17px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topbar-streak, .topbar-level { display: flex; align-items: center; gap: 4px; background: var(--surface-alt); border: 1px solid var(--surface-border); border-radius: 8px; padding: 7px 10px; font-size: 13px; color: var(--text-primary); font-weight: 600; white-space: nowrap; }

    /* ── DRAWER → SIDEBAR ────────────────────────────── */
    .drawer-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 40; animation: ftFade .2s ease; }
    .drawer-panel { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 300px; background: var(--surface); border-right: 1px solid var(--surface-border); z-index: 50; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom)); animation: ftSlideIn .28s cubic-bezier(.16,1,.3,1); box-shadow: var(--shadow-lift); }
    .drawer-panel.open { display: flex; }
    @keyframes ftFade { from{opacity:0} to{opacity:1} }
    @keyframes ftSlideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }

    .drawer-header { display: flex; align-items: center; gap: 12px; padding: 0 20px 18px; margin-bottom: 8px; border-bottom: 1px solid var(--surface-border); position: relative; }
    .drawer-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--accent-soft); border: 1px solid var(--accent-border); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .drawer-name { font-size: 15px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .drawer-fellowship { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
    .drawer-xp { font-size: 12px; color: var(--accent-strong); font-weight: 600; margin-top: 2px; }
    .drawer-close { position: absolute; top: -2px; right: 16px; background: none; border: none; color: var(--text-tertiary); font-size: 18px; cursor: pointer; padding: 6px; }
    .drawer-menu { flex: 1; overflow-y: auto; padding: 6px 12px; min-height: 0; }
    .drawer-item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; padding: 11px 12px; border-radius: 8px; font-size: 14.5px; font-weight: 500; color: var(--text-secondary); cursor: pointer; text-align: left; transition: background .15s, color .15s; }
    .drawer-item:hover { background: var(--surface-alt); }
    .drawer-item .di-ic { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
    .drawer-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
    .drawer-divider { height: 1px; background: var(--surface-border); margin: 8px 12px; }
    .drawer-footer { padding: 12px 20px 4px; font-size: 12px; color: var(--text-faint); text-align: center; }

    .prompt-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 86%; max-width: 360px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 28px; z-index: 60; box-shadow: var(--shadow-lift); display: flex; flex-direction: column; gap: 16px; animation: promptPop .18s ease; }
    @keyframes promptPop { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    .prompt-modal .ft-btn { margin-top: 0; }
    .prompt-modal .ft-btn.ghost { margin-top: -8px; }
    .prompt-modal .ft-field { margin-bottom: 0; }

    .screen-fade { animation: screenFadeIn .25s ease; }
    @keyframes screenFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .ft-nav { display: flex; justify-content: space-around; padding: 10px 0 max(14px, env(safe-area-inset-bottom)); background: var(--nav-bg); border-top: 1px solid var(--surface-border); position: relative; z-index: 10; flex-shrink: 0; }
    .ft-nav-btn { background: none; border: none; color: var(--text-faint); font-size: 11px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 13px; transition: color .15s; }
    .ft-nav-btn.active { color: var(--accent-strong); }
    .ft-nav-btn .ic { font-size: 19px; }

    /* ── CARDS ───────────────────────────────────────── */
    .figma-card { display: flex; flex-direction: column; gap: 28px; padding: 32px; border-radius: 16px; background: var(--surface); border: 1px solid var(--surface-border); box-shadow: var(--shadow-card); }
    .ft-card-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }

    .figma-form-container { display: flex; flex-direction: column; gap: 28px; padding: 32px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; box-shadow: var(--shadow-card); max-width: 560px; width: 100%; margin: 0 auto; }
    .figma-field { display: flex; flex-direction: column; gap: 12px; }

    .ft-verse { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 32px; text-align: center; box-shadow: var(--shadow-card); }
    .ft-verse-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; font-weight: 500; line-height: 1.55; color: var(--text-primary); margin-bottom: 14px; }
    .ft-verse-ref { font-size: 12px; color: var(--accent-strong); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .glow-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin: 0 auto 15px; }

    .grace-card { text-align: center; align-items: stretch; }
    .grace-glow { display: none; }
    .grace-message { font-size: 17px; font-weight: 600; line-height: 1.55; color: var(--text-primary); }

    .stats-row { display: flex; gap: 12px; }
    .stat-box { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 16px 8px; text-align: center; flex: 1; box-shadow: var(--shadow-card); }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--accent-strong); line-height: 1; }
    .stat-label { font-size: 11px; font-weight: 500; color: var(--text-tertiary); margin-top: 6px; }

    /* ── FORMS ───────────────────────────────────────── */
    .ft-label { font-size: 12px; font-weight: 500; color: var(--text-tertiary); margin-bottom: 8px; display: block; }
    .ft-input { width: 100%; background: var(--input-bg); border: 1px solid var(--surface-border); border-radius: 8px; padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text-primary); outline: none; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; }
    .ft-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ft-input::placeholder { color: var(--text-faint); }
    textarea.ft-input { resize: vertical; min-height: 96px; line-height: 1.6; }
    .ft-field { margin-bottom: 17px; }

    .ft-btn { width: 100%; background: var(--accent); border: none; border-radius: 8px; padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--accent-on); cursor: pointer; transition: background .15s, opacity .15s, transform .1s; margin-top: 4px; box-shadow: none; }
    .ft-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .ft-btn:active:not(:disabled) { transform: scale(.99); }
    .ft-btn:disabled { opacity: .55; cursor: not-allowed; }
    .ft-btn.ghost { background: transparent; border: 1px solid var(--surface-border); color: var(--text-primary); margin-top: 10px; }
    .ft-btn.ghost:hover:not(:disabled) { background: var(--surface-alt); }
    .figma-form-container .ft-btn, .figma-card .ft-btn { margin-top: 0; }

    .moods { display: flex; flex-wrap: wrap; gap: 8px; }
    .mood-chip { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 8px 14px; font-size: 14px; color: var(--text-secondary); cursor: pointer; user-select: none; }
    .mood-chip:hover { background: var(--surface-alt); }
    .mood-chip.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }

    .time-btn { width: 100%; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 12px 16px; color: var(--text-secondary); font-size: 14.5px; text-align: left; cursor: pointer; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .time-btn.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }

    .entry { border-bottom: 1px solid var(--surface-border); padding: 16px 0; display: flex; gap: 12px; }
    .entry:last-child { border-bottom: none; }
    .entry-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
    .entry-date { font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
    .entry-mood { font-size: 13px; color: var(--accent-strong); margin-bottom: 4px; font-weight: 500; }
    .entry-note { font-size: 14.5px; color: var(--text-secondary); line-height: 1.6; }

    /* ── PROGRESS / GRIDS ────────────────────────────── */
    .prog-wrap { background: var(--surface-border); border-radius: 8px; height: 8px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--accent); border-radius: 8px; transition: width .6s ease; }
    .heat-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .heat-cell { aspect-ratio: 1; border-radius: 4px; background: var(--surface-alt); border: 1px solid var(--surface-border); }
    .heat-cell.done { background: var(--accent); border-color: var(--accent); }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-cell { aspect-ratio: 1; border-radius: 8px; background: var(--surface-alt); border: 1px solid var(--surface-border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
    .week-cell.done { background: var(--accent); border-color: var(--accent); color: #fff; }

    .ft-toast { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-on); padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 999; white-space: nowrap; animation: toastIn .25s ease; box-shadow: var(--shadow-lift); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    .onboard { padding: 18px 0 26px; }
    .ob-step { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .ob-title { font-size: 28px; font-weight: 600; line-height: 1.2; color: var(--text-primary); margin-bottom: 10px; }
    .ob-sub { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 28px; }

    .install-banner { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: var(--shadow-card); }
    .install-banner p { font-size: 14px; color: var(--text-secondary); line-height: 1.45; }
    .install-btn { background: var(--accent); border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .install-btn:hover { background: var(--accent-hover); }
    .today-badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--accent-strong); font-weight: 500; }
    .divider { height: 1px; background: var(--surface-border); margin: 16px 0; }

    @keyframes answeredPulse { 0% { box-shadow: 0 0 0 0 var(--accent-border); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
    .answered-pulse { animation: answeredPulse .9s ease-out; border-radius: 12px; }

    /* ── RHYTHM ──────────────────────────────────────── */
    .rhythm-label { font-size: 13px; font-weight: 600; color: var(--text-tertiary); margin: 0; }
    .rhythm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    .rhythm-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 16px 18px; cursor: pointer; box-shadow: var(--shadow-card); transition: background .15s, border-color .15s; }
    .rhythm-card:hover { background: var(--surface-alt); }
    .rhythm-card:active { background: var(--surface-alt); }
    .ico { display: block; flex-shrink: 0; }
    .topbar-level .ico, .topbar-streak .ico { color: var(--accent-strong); }
    .rhythm-icon { color: var(--accent-strong); width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .rhythm-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .rhythm-sub { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; line-height: 1.4; }
    .rhythm-arrow { font-size: 12.5px; color: var(--accent-strong); font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    .theme-toggle-row { display: flex; gap: 12px; }
    .theme-toggle-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 16px 10px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .theme-toggle-btn.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
    .theme-toggle-btn .tt-ic { font-size: 22px; }

    .ft-skel { background: var(--surface-alt); border-radius: 6px; animation: ftSkeletonPulse 1.5s ease-in-out infinite; }
    @keyframes ftSkeletonPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .ft-skel { animation: none; opacity: .7; } }
    .ft-skel-row { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--surface-border); }
    .ft-skel-row:last-child { border-bottom: none; }
    .ft-skel-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }

    @media (hover: hover) and (pointer: fine) {
      .entry:hover { background: var(--surface-alt); border-radius: 8px; }
    }
    .entry { -webkit-tap-highlight-color: transparent; }
    .ft-nav-btn:active, .drawer-item:active { opacity: .6; }

    @media (max-width: 1023px) {
      .figma-card, .figma-form-container { padding: 24px; gap: 24px; }
      .ft-main { gap: 24px; }
    }

    /* ── DESKTOP: permanent left sidebar ─────────────── */
    @media (min-width: 1024px) {
      .ft-shell { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .drawer-panel { display: flex; position: static; grid-column: 1; grid-row: 1 / span 2; width: 260px; max-width: none; height: 100vh; animation: none; box-shadow: none; z-index: 5; }
      .ft-topbar { grid-column: 2; grid-row: 1; }
      .ft-scroll { grid-column: 2; grid-row: 2; padding: 40px; }
      .ft-nav, .menu-btn, .drawer-close { display: none; }
    }

    /* ── PREMIUM POLISH LAYER ────────────────────────── */
    .ico { display: block; flex-shrink: 0; }
    .ico.inline { display: inline-block; vertical-align: -2px; margin-right: 2px; }

    .ft-topbar { padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: var(--topbar-bg); border-bottom: 1px solid var(--surface-border); gap: 8px; }
    .topbar-icon-btn { background: transparent; border: none; width: 36px; height: 36px; border-radius: 8px; color: var(--text-secondary); }
    .topbar-icon-btn:active { background: var(--surface-alt); }
    .topbar-title { font-size: 16px; font-weight: 600; }
    .topbar-sub { font-size: 12px; color: var(--text-tertiary); }
    .topbar-streak, .topbar-level { background: none; border: none; padding: 0 2px; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .topbar-level .ico, .topbar-streak .ico { color: var(--text-secondary); }
    .topbar-right { gap: 10px; }

    .ft-main { gap: 16px; }
    .ft-scroll { padding: 20px 16px 24px; }
    .home-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }

const calcStreakFromDates = (dateStrings) => {
  const days = [...new Set(dateStrings)].sort((a,b) => new Date(b) - new Date(a));
  if (!days.length) return 0;
  let s = 0, check = new Date();
  check.setHours(0,0,0,0);
  for (const d of days) {
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diff = (check - dd) / 86400000;
    if (diff <= 1) { s++; check = dd; } else break;
  }
  return s;
};

// ── XP & LEVELS ENGINE (added) ──────────────────────────
const calculateXP = (entries, prayers, scriptures) => {
  let xp = 0;
  xp += entries.length * 10;                                              // 10 XP per devotion entry
  xp += prayers.reduce((sum, p) => sum + (Number(p.hours) || 0) * 5, 0);  // 5 XP per hour of prayer
  xp += scriptures.length * 15;                                           // 15 XP per verse saved
  xp += scriptures.reduce((sum, s) => sum + (s.practiceCount || 0) * 5, 0); // 5 XP per practice
  return xp;
};

const getLevelInfo = (xp) => {
  if (xp >= 10000) return { level: 8, title: "Saint",       next: null,  progress: 100 };
  if (xp >= 5000)  return { level: 7, title: "Apostle",     next: 10000, progress: ((xp - 5000) / 5000) * 100 };
  if (xp >= 2500)  return { level: 6, title: "Warrior",     next: 5000,  progress: ((xp - 2500) / 2500) * 100 };
  if (xp >= 1000)  return { level: 5, title: "Disciple",    next: 2500,  progress: ((xp - 1000) / 1500) * 100 };
  if (xp >= 500)   return { level: 4, title: "Follower",    next: 1000,  progress: ((xp - 500) / 500) * 100 };
  if (xp >= 250)   return { level: 3, title: "Believer",    next: 500,   progress: ((xp - 250) / 250) * 100 };
  if (xp >= 100)   return { level: 2, title: "Seeker",      next: 250,   progress: ((xp - 100) / 150) * 100 };
  return              { level: 1, title: "New Believer", next: 100,   progress: (xp / 100) * 100 };
};

// ── SABBATH REVIEW ENGINE (added) ──────────────────────
// Same rolling calendar-day window used by computeEngagementMetrics's "this week" figures,
// so the Sabbath Review and the dashboard/mentee stats can't quietly disagree with each other.
const last7DateStrings = () => {
  const out = new Set();
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    out.add(d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }));
  }
  return out;
};

const getSabbathData = (entries, prayers, scriptures) => {
  const days = last7DateStrings();
  // entries/prayers always carry a `date` string, so filter on that (calendar-day accurate).
  // Older scripture rows may not have a `date` field yet, so fall back to createdAtMs for those.
  const weekEntries    = entries.filter(e => days.has(e.date));
  const weekPrayers    = prayers.filter(p => days.has(p.date));
  const weekScriptures = scriptures.filter(s => s.date ? days.has(s.date) : (s.createdAtMs || 0) > Date.now() - 7 * 24 * 60 * 60 * 1000);
  const totalHours     = weekPrayers.reduce((sum, p) => sum + (Number(p.hours) || 0), 0);
  const answeredPrayers= weekPrayers.filter(p => p.status === "answered").length;
  const uniqueDays     = [...new Set(weekEntries.map(e => e.date))].length;
  const moodMap = {};
  weekEntries.forEach(e => { moodMap[e.mood] = (moodMap[e.mood]||0)+1; });
  const topMood = Object.entries(moodMap).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
  return { weekEntries, weekPrayers, weekScriptures, totalHours, answeredPrayers, uniqueDays, topMood };
};

// ── Leader Dashboard / My Mentees engagement metrics ─────────────────
const computeEngagementMetrics = (entryDates, prayerDates, scriptures) => {
  const todayMid = new Date(); todayMid.setHours(0,0,0,0);
  const entryDaySet = new Set(entryDates.map(d => { const dd = new Date(d); dd.setHours(0,0,0,0); return dd.getTime(); }));
  let consistentDays7 = 0;
  for (let i = 0; i < 7; i++) {
    const check = new Date(todayMid); check.setDate(check.getDate() - i);
    if (entryDaySet.has(check.getTime())) consistentDays7++;
  }
  const consistency7 = Math.round((consistentDays7 / 7) * 100);
  const prayersThisWeek = prayerDates.filter(d => {
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diffDays = (todayMid - dd) / 86400000;
    return diffDays >= 0 && diffDays < 7;
  }).length;
  const versesTotal = scriptures.length;
  const versesPracticed = scriptures.filter(s => (s.practiceCount || 0) > 0).length;
  const versesMastered = scriptures.filter(s => (s.familiarity || 0) >= 85).length;
  return { consistency7, consistentDays7, prayersThisWeek, versesTotal, versesPracticed, versesMastered };
};

// ── Member stats (aggregated on members/{uid}.stats) ───────────────────────
const STAT_DATES_KEEP = 30;
const trimDates = (arr) => arr.slice(-STAT_DATES_KEEP);
const mergeDate = (arr, d) => trimDates([...(arr || []).filter(x => x !== d), d]);
const statsFromData = (entries, prayers, scriptures) => {
  const chrono = [...entries].sort((a,b) => (a.createdAtMs||0) - (b.createdAtMs||0));
  const prayersChrono = [...prayers].sort((a,b) => (a.createdAtMs||0) - (b.createdAtMs||0));
  const activeDates = trimDates([...new Set(chrono.map(e => e.date).filter(Boolean))]);
  const stamps = [...entries, ...prayers, ...scriptures].map(x => x.createdAtMs || 0);
  return {
    totalEntries: entries.length,
    totalPrayers: prayers.length,
    totalScriptures: scriptures.length,
    totalPrayerHours: prayers.reduce((s,p) => s + (parseFloat(p.hours) || 0), 0),
    activeDates,
    prayerDates: prayersChrono.map(p => p.date).filter(Boolean).slice(-60),
    versesPracticed: scriptures.filter(s => (s.practiceCount||0) > 0).length,
    versesMastered: scriptures.filter(s => (s.familiarity||0) >= 85).length,
    lastLoggedMs: stamps.length ? Math.max(...stamps) : 0,
  };
};
// Same shape computeEngagementMetrics returns, but built from a member's stats object.
const metricsFromStats = (stats) => {
  const s = stats || {};
  const base = computeEngagementMetrics(s.activeDates || [], s.prayerDates || [], []);
  return { ...base, versesTotal: s.totalScriptures || 0, versesPracticed: s.versesPracticed || 0, versesMastered: s.versesMastered || 0 };
};
const rowFromMember = (m) => {
  const s = m.stats || {};
  const days = s.activeDates || [];
  const sorted = [...days].sort((a,b) => new Date(b) - new Date(a));
  return {
    uid: m.uid, name: m.name || "Unnamed", fellowship: m.fellowship || "",
    totalEntries: s.totalEntries || 0, streak: calcStreakFromDates(days),
    lastDate: sorted[0] || null, ...metricsFromStats(s),
  };
};
const sortRows = (rows) => rows.sort((a,b) => b.streak - a.streak || b.totalEntries - a.totalEntries);

// Safely merges a stats patch into members/{uid}.stats. Never throws — a stats failure
// must never block an entry from saving. `cache` is a ref holding the latest known stats
// so the capped date lists can be trimmed without an extra read.
//   patch: { inc: {field: n}, activeDate, prayerDate, set: {field: value} }
async function updateMemberStats(uid, patch, cache) {
  if (!uid || !window.FB) return;
  try {
    const { db, doc, updateDoc, setDoc, increment } = window.FB;
    const cur = (cache && cache.current) || {};
    const next = { ...cur };
    const payload = { "stats.lastLoggedMs": Date.now() };
    next.lastLoggedMs = Date.now();
    Object.entries(patch.inc || {}).forEach(([k, n]) => {
      payload["stats." + k] = increment(n);
      next[k] = (next[k] || 0) + n;
    });
    if (patch.activeDate) { next.activeDates = mergeDate(cur.activeDates, patch.activeDate); payload["stats.activeDates"] = next.activeDates; }
    if (patch.prayerDate) { next.prayerDates = [...(cur.prayerDates || []), patch.prayerDate].slice(-60); payload["stats.prayerDates"] = next.prayerDates; }
    if (cache) cache.current = next;
    const ref = doc(db, "members", uid);
    try { await updateDoc(ref, payload); }
    catch (e) {
      if (e && e.code === "not-found") await setDoc(ref, { stats: next }, { merge: true });
      else throw e;
    }
  } catch (e) { console.warn("[FaithTracker] stats update failed (entry is still saved)", e); }
}

// Scrolls a field into view and (for inputs) focuses it without a second scroll jump.
const focusField = (el) => {
  if (!el) return;

};

const pickContextualVerse = ({ streak, mood, tod }) => {
  const rule = CONTEXT_VERSES.find(r =>
    (!r.mood || r.mood === mood) &&
    (!r.tod || r.tod === tod) &&
    (!r.minStreak || streak >= r.minStreak));
  return rule ? rule.verse : null;
};

// Circular XP ring (SVG) with the level number centred inside.
function LevelRing({ level, progress, size = 60 }) {
  const stroke = 5;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, progress || 0));
  return (
    <div className="level-ring" style={{ width: size, height: size }} role="img" aria-label={`Level ${level}, ${Math.round(pct)} percent to next level`}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true">
        <circle className="ring-track" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke} />
        <circle className="ring-fill" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - pct / 100)} transform={`rotate(-90 ${size/2} ${size/2})`} />
      </svg>
      <div className="level-ring-num">{level}</div>
    </div>
  );
}

// ── Virtualized list (react-window FixedSizeList, loaded lazily from esm.sh) ──
function useViewportHeight() {
  const [h, setH] = useState(window.innerHeight);
  useEffect(() => {
    const f = () => setH(window.innerHeight);
    window.addEventListener("resize", f);
    return () => window.removeEventListener("resize", f);
  }, []);
  return h;
}
function VList({ items, itemSize, renderItem, getKey, minCount = 20, reserve = 300, clamp = false }) {
  const vh = useViewportHeight();
  const [, bump] = useState(0);
  useEffect(() => {
    if (window.FixedSizeList) return;
    const f = () => bump(n => n + 1);
    window.addEventListener("ft-vlist-ready", f);
    return () => window.removeEventListener("ft-vlist-ready", f);
  }, []);
  const FSL = window.FixedSizeList;
  // Short lists (or react-window not loaded) render exactly as before.
  if (!FSL || items.length <= minCount) {
    return <>{items.map((it, i) => <React.Fragment key={getKey ? getKey(it, i) : i}>{renderItem(it, i)}</React.Fragment>)}</>;
  }
  const height = Math.max(240, Math.min(items.length * itemSize, vh - reserve));
  return (
    <FSL
      className={clamp ? "vlist vlist-clamp" : "vlist"}
      height={height} width="100%" itemCount={items.length} itemSize={itemSize} itemData={items}
      itemKey={(i, d) => (getKey ? getKey(d[i], i) : i)}
    >
      {({ index, style, data }) => <div style={style} className="vrow">{renderItem(data[index], index)}</div>}
    </FSL>
  );
}

      await window.FB.resetPassword(authEmail.trim());

function HomeScreen(p) {
  const { activeNudge, dismissInstallNudge, dismissNudge, entries, entriesReady, fellowshipGoal, handleInstall, handleShareSnapshot, installNudgeDismissed, isStandalone, levelInfo, openSabbathReview, prayers, prayersReady, scriptures, scripturesReady, setScreen, showInstall, snapshotLoading, streak, todaysEntries, uid, user, verse, xp } = p;
    if (uid && !(entriesReady && prayersReady && scripturesReady)) {
      return (<HomeSkeletonM />);
    }
    const hour = new Date().getHours();
    const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    const devotionDone = todaysEntries.length > 0;
    const today = todayStr();
    const prayerDone = prayers.some(x => x.date === today);
    const scriptureDone = scriptures.some(x => x.date === today || x.lastPracticed === today);
    const allDone = devotionDone && prayerDone && scriptureDone;
    const activePrayers = prayers.filter(p => p.status === "praying").length;
    const yesterdayEntry = entries.find(e => e.date === yesterdayStr());
    const yesterdayMoodWord = yesterdayEntry ? yesterdayEntry.mood.replace(/^\S+\s*/, "") : null;
    // Only show grace right after a streak has actually broken (streak === 0) and the lapse
    // is recent — not to someone returning after months away, and not every single day to
    // someone whose rhythm just isn't daily.
    const lastEntryMs = entries.length ? Math.max(...entries.map(e => e.createdAtMs || 0)) : 0;
    const daysSinceLastEntry = lastEntryMs ? Math.floor((Date.now() - lastEntryMs) / 86400000) : null;
    // Re-engagement uses calendar days so "2+ days ago" means the day before yesterday or earlier.
    let calDaysSince = null;
    if (lastEntryMs) {
      const a = new Date(lastEntryMs); a.setHours(0, 0, 0, 0);
      const b = new Date(); b.setHours(0, 0, 0, 0);
      calDaysSince = Math.round((b - a) / 86400000);
    }
    const showReengage = calDaysSince !== null && calDaysSince >= 2;
    // The re-engagement banner supersedes the grace card so the two never stack.
    const missedYesterday = !showReengage && entries.length > 0 && !devotionDone && streak === 0 && daysSinceLastEntry !== null && daysSinceLastEntry <= 2;
    const isSunday = new Date().getDay() === 0;

    // Next incomplete action — devotion > prayer > scripture.
    const hero = !devotionDone ? {

        cta: "Practice scripture", go: () => setScreen("scripture"),

    const heroSteps = [["Devotion", devotionDone], ["Prayer", prayerDone], ["Scripture", scriptureDone]];
    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

    return (

        <div className="home-head">
          <div className="home-greeting">{greet}, {user.name} <Ico name="dove" size={22} /></div>
          <div className="home-sub">
            {yesterdayMoodWord
              ? `You said you were "${yesterdayMoodWord}" yesterday — let's continue that.`
              : "Make space for God today."}
          </div>
        </div>

        {/* Sunday recap — opens the Sabbath Review */}
        {isSunday && (
          <div className="rhythm-card sunday-card" role="button" tabIndex={0} onClick={openSabbathReview} onKeyDown={activateOnKey(openSabbathReview)}>
            <div className="rhythm-icon" style={{background:"var(--surface)", border:"1px solid var(--accent-border)"}}><Ico name="sabbath" size={20} /></div>
            <div style={{flex:1}}>
              <div className="rhythm-title">Your week with God</div>
              <div className="rhythm-sub">{plural(sunday.uniqueDays, "day")} · {plural(sunday.weekPrayers.length, "prayer")} · {plural(sunday.weekScriptures.length, "verse")}</div>

            <div className="rhythm-arrow" aria-hidden="true"><Ico name="chevron" size={18} /></div>

        {showReengage && (

            <button className="ft-btn" onClick={() => setScreen("history")}>Review your journey</button>

        <div className="more-divider" role="separator"><span>More</span></div>

        {/* Level ring (replaces the XP bar) */}

function LogScreen(p) {
  const { submitLog, todaysEntries, verse, yesterdayMood } = p;
  // Auto-fill: yesterday's mood is pre-selected, and the passage starts as today's verse.
  const [mood, setMood] = useState(yesterdayMood || "");
  const [moodAuto, setMoodAuto] = useState(!!yesterdayMood);
  const [passage, setPassage] = useState(verse ? verse.ref : "");
  const [passageAuto, setPassageAuto] = useState(!!verse);
  const [reflect, setReflect] = useState("");
  const [errs, setErrs] = useState({});
  const moodRef = useRef(null);
  const reflectRef = useRef(null);
  // If entries finish loading after this screen mounted, still pre-select (never overrides a choice).
  useEffect(() => { if (!mood && yesterdayMood) { setMood(yesterdayMood); setMoodAuto(true); } }, [yesterdayMood]);
  const pickMood = (m) => { setMood(m); setMoodAuto(false); setErrs(e => ({ ...e, mood: false })); };
  const save = () => {
    const e = { mood: !mood, reflect: !reflect.trim() };
    setErrs(e);
    if (e.mood || e.reflect) {
      focusField(e.mood ? moodRef.current : reflectRef.current);
      submitLog({ mood, passage, reflect: reflect.trim() }); // App shows its toast and stops
      return;
    }
    haptic(10);
    submitLog({ mood, passage, reflect: reflect.trim() });
  };
  return (
    <>
      <div className="figma-form-container">
      {todaysEntries.length > 0 && (
        <div className="today-badge"><Ico name="check" size={14} /> {todaysEntries.length} entr{todaysEntries.length===1?"y":"ies"} today — add another</div>
      )}
      <div className="figma-field">
        <div className="ft-card-title">How are you feeling?</div>
        <div ref={moodRef} className={`moods${errs.mood ? " field-err" : ""}`}>
          {MOODS.map(m => <div key={m} className={`mood-chip${mood===m?" sel":""}`} onClick={() => pickMood(m)}>{moodText(m)}</div>)}
        </div>
        {errs.mood && <div className="field-msg-err" role="alert">Choose how you're feeling to continue.</div>}
        {moodAuto && !errs.mood && <div className="field-hint">Pre-selected from yesterday — tap another to change it.</div>}
      </div>
      <div className="figma-field">
        <div className="ft-card-title">Bible Passage</div>
        <input className="ft-input" placeholder="e.g. John 3:16, Psalms 23..." value={passage} onChange={e => { setPassage(e.target.value); setPassageAuto(false); }} />
        {passageAuto && <div className="field-hint">Pre-filled with today's verse — change it if you're reading elsewhere.</div>}
      </div>
      <div className="figma-field">
        <div className="ft-card-title">Your Reflection</div>
        <textarea ref={reflectRef} className={`ft-input${errs.reflect ? " err" : ""}`} placeholder="What did the Holy Spirit speak to you today?" value={reflect} onChange={e => { setReflect(e.target.value); if (errs.reflect) setErrs(x => ({ ...x, reflect: false })); }} rows={5} />
        {errs.reflect && <div className="field-msg-err" role="alert">Write a short reflection to save.</div>}
      </div>
      <button className="ft-btn" onClick={save}>Save Entry (+10 XP)</button>
      </div>
    </>
  );
}

    const totalHours = prayers.reduce((sum, p) => sum + (Number(p.hours) || 0), 0);
    return (
      <>
        <button className="ft-btn" onClick={() => setScreen("prayerlog")}><Ico name="prayer" size={18} /> Add Prayer Request</button>

          <div className="stat-box"><div className="stat-num">{totalHours}</div><div className="stat-label">Hours Prayed</div></div>

          <div className="stat-box"><div className="stat-num">{prayers.filter(p=>p.status==="answered").length}</div><div className="stat-label">Answered</div></div>
        </div>
        <div className="moods" style={{margin:"16px 0"}}>
          {[["praying","Praying"],["answered","Answered"],["all","All"]].map(([id,lb]) => (

          ) : filtered.map(p => (
            <div key={p.id} className={`entry${p.id===justAnsweredId?" answered-pulse":""}`}>
              <div className="entry-dot" style={p.status==="answered" ? {background:"var(--sage)", boxShadow:"0 0 0 4px var(--sage-soft)"} : undefined} />
              <div style={{flex:1}}>
                <div className="entry-date">
                  {p.category}{p.date && <span style={{color:"var(--text-faint)"}}> · {p.date}</span>}
                  {p.hours ? <span style={{color:"var(--accent-strong)"}}> · {p.hours} hr{p.hours==1?"":"s"}</span> : null}
                  {p.status==="answered" && <span style={{color:"var(--sage)"}}> · Answered</span>}

                <div className="entry-note">{p.text}</div>
                {p.scripture && <div className="entry-mood" style={{marginTop:4}}>{p.scripture}</div>}

                  <div style={{fontSize:13,color:"var(--sage)",fontStyle:"italic",marginTop:6,lineHeight:1.5}}>"{p.answeredNote}"</div>

                  <button className="ft-btn ghost" style={{marginTop:10,padding:"8px 12px",fontSize:13}} onClick={() => markAnswered(p.id)}>Mark as Answered</button>

function AddPrayerScreen(p) {
  const { submitPrayer } = p;
  const [prayerCategory, setPrayerCategory] = useState("");
  const [prayerText, setPrayerText] = useState("");
  const [prayerScripture, setPrayerScripture] = useState("");
  const [prayerHours, setPrayerHours] = useState("");
  const [errs, setErrs] = useState({});
  const catRef = useRef(null);
  const textRef = useRef(null);
  const hoursRef = useRef(null);
  const clearErr = (k) => setErrs(e => (e[k] ? { ...e, [k]: false } : e));
  const save = () => {
    const e = { cat: !prayerCategory, text: !prayerText.trim(), hours: !(parseFloat(prayerHours) > 0) };
    setErrs(e);
    const firstBad = e.cat ? catRef.current : e.text ? textRef.current : e.hours ? hoursRef.current : null;
    if (firstBad) focusField(firstBad); // submitPrayer below shows its toast and stops
    submitPrayer({ prayerCategory, prayerText: prayerText.trim(), prayerScripture, prayerHours });
  };
  return (
    <>
      <div className="figma-form-container">
      <div className="figma-field">
        <div className="ft-card-title">Category</div>
        <div ref={catRef} className={`moods${errs.cat ? " field-err" : ""}`}>
          {PRAYER_CATEGORIES.map(c => (
            <div key={c} className={`mood-chip${prayerCategory===c?" sel":""}`} onClick={() => { setPrayerCategory(c); clearErr("cat"); }}>{c}</div>
          ))}
        </div>
        {errs.cat && <div className="field-msg-err" role="alert">Choose a category.</div>}
      </div>
      <div className="figma-field">
        <div className="ft-card-title">What are you praying for?</div>
        <textarea ref={textRef} className={`ft-input${errs.text ? " err" : ""}`} placeholder="Write your prayer request..." value={prayerText} onChange={e => { setPrayerText(e.target.value); clearErr("text"); }} rows={4} />
        {errs.text && <div className="field-msg-err" role="alert">Write what you're praying for.</div>}
      </div>
      <div className="figma-field">
        <div className="ft-card-title">Scripture (optional)</div>
        <input className="ft-input" placeholder="e.g. Philippians 4:6-7" value={prayerScripture} onChange={e => setPrayerScripture(e.target.value)} />
      </div>
      <div className="figma-field">
        <div className="ft-card-title">Hours Spent in Prayer</div>
        <input ref={hoursRef} type="number" min="0.25" step="0.25" className={`ft-input${errs.hours ? " err" : ""}`} placeholder="e.g. 0.5 for 30 minutes" value={prayerHours} onChange={e => { setPrayerHours(e.target.value); clearErr("hours"); }} />
        {errs.hours
          ? <div className="field-msg-err" role="alert">Enter the time you prayed (e.g. 0.25 for 15 minutes).</div>
          : <p style={{fontSize:12,color:"var(--text-tertiary)",lineHeight:1.5,marginTop:8}}>Log any amount of time — even a few minutes counts.</p>}
      </div>
      <button className="ft-btn" onClick={save}>Save Prayer (+5 XP/hr)</button>
      </div>
    </>
  );
}

function JourneyScreen(p) {
  const { entries, entriesReady, prayers, prayersReady, setScreen } = p;
  const [journeyFilter, setJourneyFilter] = useState("all");
    const journeyItems = [
      ...entries.map(e => ({ kind: "devotion", sortKey: e.createdAtMs || 0, ...e })),
      ...prayers.map(p => ({ kind: p.status === "answered" ? "answered" : "prayer", sortKey: p.createdAtMs || 0, ...p })),
    ].sort((a,b) => b.sortKey - a.sortKey);

    const filteredJourney = journeyItems.filter(item => {
      if (journeyFilter === "all") return true;
      return item.kind === journeyFilter;
    });

    const answeredCount = prayers.filter(p => p.status === "answered").length;

    return (
      <>
        {journeyItems.length > 0 && (
          <div style={{fontSize:14, color:"var(--text-secondary)", fontStyle:"italic", marginBottom:16, lineHeight:1.5}}>
            This is what God has done in your life.
          </div>
        )}
        <div className="moods" style={{marginBottom:16}}>
          {[["all","All"],["devotion","Devotions"],["prayer","Prayers"],["answered",`Answered${answeredCount?` (${answeredCount})`:""}`]].map(([id,lb]) => (
            <div key={id} className={`mood-chip${journeyFilter===id?" sel":""}`} onClick={() => setJourneyFilter(id)}>{lb}</div>
          ))}
        </div>
        <div className="figma-card">
          {!(entriesReady && prayersReady) ? (
            <EntryRowSkeletonM count={4} />
          ) : filteredJourney.length === 0 ? (
            <EmptyState
              icon={journeyFilter === "devotion" || journeyFilter === "all" ? "journey" : "prayer"}
              line={journeyFilter === "answered" ? "Answered prayers will gather here. Keep bringing your requests — God is faithful."
                : journeyFilter === "prayer" ? "Lift up your first prayer — He's listening."
                : journeyFilter === "devotion" ? "Your first reflection is waiting to be written."
                : "Your story with God starts with one small step today."}
              cta={journeyFilter === "answered" || journeyFilter === "prayer" ? "Add a prayer" : "Log a devotion"}
              onCta={() => setScreen(journeyFilter === "answered" || journeyFilter === "prayer" ? "prayerlog" : "log")} />
          ) : <VList items={filteredJourney} itemSize={140} minCount={40} clamp getKey={(item) => `${item.kind}-${item.id || item.date}`} renderItem={(item) => (
            <div className="entry">
              <div className="entry-dot" style={item.kind==="answered" ? {background:"var(--sage)", boxShadow:"0 0 0 4px var(--sage-soft)"} : undefined} />
              <div style={{flex:1}}>
                {item.kind === "devotion" ? (
                  <>
                    <div className="entry-date">
                      <Ico name="journey" size={14} inline /> Devotion · {item.date}{item.time && <span style={{color:"var(--text-faint)"}}> · {item.time}</span>}
                      {item.passage && <span style={{color:"var(--accent-strong)"}}> · {item.passage}</span>}
                    </div>
                    <div className="entry-mood">{moodText(item.mood)}</div>
                    <div className="entry-note">{item.note}</div>
                  </>
                ) : (
                  <>
                    <div className="entry-date">
                      <Ico name="prayer" size={14} inline /> {item.kind==="answered" ? "Answered Prayer" : "Prayer"} · {item.category}{item.date && <span style={{color:"var(--text-faint)"}}> · {item.date}</span>}
                    </div>
                    <div className="entry-note">{item.text}</div>
                    {item.scripture && <div className="entry-mood" style={{marginTop:4}}>{item.scripture}</div>}
                    {item.kind==="answered" && item.answeredNote && (
                      <div style={{fontSize:13,color:"var(--sage)",fontStyle:"italic",marginTop:6,lineHeight:1.5}}>"{item.answeredNote}"</div>
                    )}
                  </>
                )}
              </div>
            </div>
          )} />}
        </div>
      </>
    );
}

function ProgressScreen(p) {
  const { entries, levelInfo, streak, uniqueDays, user, xp } = p;
    const pct = Math.min(Math.round((uniqueDays/30)*100), 100);
    const moodMap = {};
    entries.forEach(e => { moodMap[e.mood] = (moodMap[e.mood]||0)+1; });
    const topMood = Object.entries(moodMap).sort((a,b)=>b[1]-a[1])[0];
    return (
      <>
        {/* Spiritual Level card (added) */}
        <div className="figma-card">
          <div className="ft-card-title">Spiritual Level</div>
          <div style={{display:"flex", alignItems:"center", gap:16}}>
            <LevelRing level={levelInfo.level} progress={levelInfo.progress} size={60} />
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:13, color:"var(--text-secondary)", fontWeight:600, letterSpacing:1}}>{levelInfo.title.toUpperCase()}</div>
              <div style={{fontSize:20, fontWeight:700, color:"var(--accent-strong)"}}>{xp} XP</div>
            </div>
            <div style={{fontSize:11, color:"var(--text-tertiary)", textAlign:"right"}}>Next: {levelInfo.next || "MAX"}</div>
          </div>
        </div>

        <div className="figma-card">
          <div className="ft-card-title">Monthly Goal — 30 Days</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--text-tertiary)"}}>
            <span>{uniqueDays} days logged</span><span>{pct}%</span>
          </div>
          <div className="prog-wrap"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:16}}>
          {[{l:"Day Streak",v:streak},{l:"Total Entries",v:entries.length},{l:"Top Mood",v:topMood?moodText(topMood[0]):"—"},{l:"Fellowship",v:user.fellowship||"—"}].map(s => (
            <div key={s.l} className="stat-box">
              <div style={{fontSize:23,color:"var(--accent-strong)",fontWeight:700}}>{s.v}</div>
              <div className="stat-label">{s.l}</div>
            </div>
          ))}
        </div>
        <div className="figma-card">
          <div className="ft-card-title">30-Day Activity</div>
          <div className="heat-grid">
            {Array.from({length:30},(_,i) => {
              const d = new Date(); d.setDate(d.getDate() - (29-i));
              const ds = d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
              return <div key={i} className={`heat-cell${entries.some(e=>e.date===ds)?" done":""}`} />;
            })}
          </div>
        </div>
        <div className="ft-verse" style={{padding:"20px 18px"}}>
          <div style={{fontSize:11,color:"var(--text-tertiary)",letterSpacing:2,textTransform:"uppercase",marginBottom:9,fontWeight:600}}>Encouragement</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontStyle:"italic",fontWeight:500,color:"var(--text-primary)",lineHeight:1.5}}>"He who began a good work in you will carry it on to completion."</div>
          <div className="ft-verse-ref" style={{marginTop:9}}>— Philippians 1:6</div>
        </div>
      </>
    );
}

function App() {
  const [screen,  setScreen]  = useState("loading");
  const [toast,   setToast]   = useState(null);
  const [fallbackVerse]       = useState(() => VERSES[Math.floor(Math.random() * VERSES.length)]); // used only when no contextual rule matches
  const [user,    setUser]    = useState({ name:"", fellowship:"", isMentor:false, mentorCode:"", mentorUid:"", mentorName:"", isLeader:false });
  const [rTime,   setRTime]   = useState(() => load("ft_rtime", "6:00 AM – Dawn Watch"));
  const [entries, setEntries] = useState([]);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall,    setShowInstall]    = useState(false);
  const [installNudgeDismissed, setInstallNudgeDismissed] = useState(() => load("ft_install_nudge_dismissed", false));
  const [drawerOpen,   setDrawerOpen]   = useState(false);
  const [uid,        setUid]        = useState(null);
  const [cloudReady, setCloudReady] = useState(false);
  const [entriesReady,    setEntriesReady]    = useState(false);
  const [prayersReady,    setPrayersReady]    = useState(false);
  const [scripturesReady, setScripturesReady] = useState(false);
  const [dashData,   setDashData]   = useState(null);
  const [menteeData, setMenteeData] = useState(null);
  const [fellowshipGoal, setFellowshipGoalState] = useState(null);
  const [nudges,       setNudges]       = useState([]);
  const [activeNudge,  setActiveNudge]  = useState(null);
  const [nudgingMentee, setNudgingMentee] = useState(null);
  const [scriptures,   setScriptures]   = useState([]);
  const [practiceVerse,setPracticeVerse]= useState(null);
  const [prayers,        setPrayers]        = useState([]);
  const [justAnsweredId, setJustAnsweredId]  = useState(null);
  const [snapshotLoading, setSnapshotLoading] = useState(false);
  const [modal, setModal] = useState(null); // { title, placeholder, submitLabel, isPassword, onSubmit(value) } — replaces window.prompt()
  const dashCacheRef = useRef({ data: null, ts: 0 }); // avoids re-reading the whole fellowship's data every time the dashboard is opened
  const statsRef = useRef(null); // latest known members/{uid}.stats
  const statsMissingRef = useRef(false);
  const statsLoadFailedRef = useRef(false); // never backfill stats from data that failed to load
  const lastSavedProfile = useRef({ name: null, fellowship: null });
  const skipNextProfileWrite = useRef(false); // avoids re-writing the profile doc right after loading it from Firestore
  // ── XP / Level / Sabbath state (added) ──
  const [xp, setXp] = useState(0);
  const [levelInfo, setLevelInfo] = useState({ level: 1, title: "New Believer", next: 100, progress: 0 });
  const [sabbathData, setSabbathData] = useState(null);
  // ── UI refresh state (quick-add sheet, level-up overlay, clock for streak flame / verse) ──
  const [sheetOpen, setSheetOpen] = useState(false);
  const [levelUp, setLevelUp] = useState(null);
  const [clockHour, setClockHour] = useState(() => new Date().getHours());
  const prevLevelRef = useRef(null);
  const [theme, setTheme] = useState(() => load("ft_theme", (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light"));

  useEffect(() => save("ft_rtime", rTime), [rTime]);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    save("ft_theme", theme);
  }, [theme]);

  // ── XP recalculation whenever entries / prayers / scriptures change ──
  useEffect(() => {
    const currentXp = calculateXP(entries, prayers, scriptures);
    setXp(currentXp);
    setLevelInfo(getLevelInfo(currentXp));
  }, [entries, prayers, scriptures]);

  // ── Level-up detection ──
  // Skips the initial data load (and waits for levelInfo to catch up with the loaded data)
  // so returning users never see a false celebration.
  useEffect(() => {
    if (!(entriesReady && prayersReady && scripturesReady)) { prevLevelRef.current = null; return; }
    if (getLevelInfo(calculateXP(entries, prayers, scriptures)).level !== levelInfo.level) return;
    const prev = prevLevelRef.current;
    prevLevelRef.current = levelInfo.level;
    if (prev !== null && levelInfo.level > prev) {
      setLevelUp({ level: levelInfo.level, title: levelInfo.title });
      haptic([50, 30, 50]);
    }
  }, [levelInfo.level, entriesReady, prayersReady, scripturesReady, entries, prayers, scriptures]);

  // Level-up overlay auto-dismisses after 3s
  useEffect(() => {
    if (!levelUp) return;
    const t = setTimeout(() => setLevelUp(null), 3000);
    return () => clearTimeout(t);
  }, [levelUp]);

  // Keep the hour fresh (streak flame dims after 6pm; verse can shift by time of day)
  useEffect(() => {
    const id = setInterval(() => setClockHour(new Date().getHours()), 60000);
    return () => clearInterval(id);
  }, []);

  // Esc closes the quick-add sheet
  useEffect(() => {
    if (!sheetOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setSheetOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [sheetOpen]);

  useEffect(() => {
    if (!window.FB) return;
    const unsub = window.FB.onAuthChange(async (fbUser) => {
      if (!fbUser) {
        setUid(null); setCloudReady(false); setEntries([]); setPrayers([]);
        setUser({ name:"", fellowship:"", isMentor:false, mentorCode:"", mentorUid:"", mentorName:"", isLeader:false });
        setScreen("auth");
        setEntriesReady(false); setPrayersReady(false); setScripturesReady(false);
        return;
      }
      setUid(fbUser.uid);
      setCloudReady(true);
      const { db, doc, getDoc } = window.FB;
      // Check whether this user is listed in config/admins.uids
      let leaderFlag = false;
      try {
        const adminSnap = await getDoc(doc(db, "config", "admins"));
        if (adminSnap.exists() && Array.isArray(adminSnap.data().uids)) {
          leaderFlag = adminSnap.data().uids.includes(fbUser.uid);
        }
      } catch (e) { /* treat as non-leader */ }
      try {
        const snap = await getDoc(doc(db, "members", fbUser.uid));
        if (snap.exists()) {
          const data = snap.data();
          skipNextProfileWrite.current = true;
          lastSavedProfile.current = { name: data.name || "", fellowship: data.fellowship || "", isMentor: !!data.isMentor, mentorCode: data.mentorCode || "", mentorUid: data.mentorUid || "", mentorName: data.mentorName || "" };
          statsRef.current = data.stats || null;
          statsMissingRef.current = !data.stats;
          setUser({
            name: data.name || "", fellowship: data.fellowship || "",
            isMentor: !!data.isMentor, mentorCode: data.mentorCode || "",
            mentorUid: data.mentorUid || "", mentorName: data.mentorName || "",
            isLeader: leaderFlag,
          });
          setScreen("home");
        } else {
          setScreen("onboard");
        }
      } catch (e) { setScreen("onboard"); }
    });
    return () => unsub && unsub();
  }, []);

  // One-time backfill: members created before stats existed get them computed from their own data.
  useEffect(() => {
    if (!uid || !window.FB || !statsMissingRef.current) return;
    if (!(entriesReady && prayersReady && scripturesReady)) return;
    if (statsLoadFailedRef.current) return; // try again on the next app open
    statsMissingRef.current = false;
    const stats = statsFromData(entries, prayers, scriptures);
    statsRef.current = stats;
    const { db, doc, setDoc } = window.FB;
    setDoc(doc(db, "members", uid), { stats }, { merge: true }).catch(e => console.warn("[FaithTracker] stats backfill failed", e));
  }, [uid, entriesReady, prayersReady, scripturesReady]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, orderBy, limit, getDocs } = window.FB;
    (async () => {
      try {
        // Capped to the most recent ~400 entries so long-time users aren't downloading
        // their entire history on every login. Requires a composite index on
        // entries(uid ASC, createdAtMs DESC) — Firestore will print a direct link to
        // create it the first time this runs if it's missing.
        const q = query(collection(db, "entries"), where("uid", "==", uid), orderBy("createdAtMs", "desc"), limit(400));
        const snap = await getDocs(q);
        const cloudEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        setEntries(cloudEntries);
      } catch (e) { console.warn("[FaithTracker] failed to load entries", e); statsLoadFailedRef.current = true; }
      finally { setEntriesReady(true); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, orderBy, limit, getDocs } = window.FB;
    (async () => {
      try {
        // Same read-cost cap as entries above; needs a matching composite index on
        // prayers(uid ASC, createdAtMs DESC).
        const q = query(collection(db, "prayers"), where("uid", "==", uid), orderBy("createdAtMs", "desc"), limit(400));
        const snap = await getDocs(q);
        const cloudPrayers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        setPrayers(cloudPrayers);
      } catch (e) { console.warn("[FaithTracker] failed to load prayers", e); statsLoadFailedRef.current = true; }
      finally { setPrayersReady(true); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, orderBy, limit, getDocs } = window.FB;
    (async () => {
      try {
        // Needs a composite index on scriptures(uid ASC, createdAtMs DESC).
        const q = query(collection(db, "scriptures"), where("uid", "==", uid), orderBy("createdAtMs", "desc"), limit(200));
        let cloudVerses;
        try {
          const snap = await getDocs(q);
          cloudVerses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (indexErr) {
          // Composite index missing or still building: fall back to the plain query and sort here.
          console.warn("[FaithTracker] verse index unavailable, using fallback query", indexErr);
          const snap = await getDocs(query(collection(db, "scriptures"), where("uid", "==", uid)));
          cloudVerses = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0)).slice(0, 200);
        }
        setScriptures(cloudVerses);
      } catch (e) { console.warn("[FaithTracker] failed to load verses", e); statsLoadFailedRef.current = true; }
      finally { setScripturesReady(true); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, doc, getDoc } = window.FB;
    (async () => {
      try {
        const snap = await getDoc(doc(db, "stats", "fellowshipGoal"));
        if (snap.exists()) setFellowshipGoalState(snap.data());
      } catch (e) { console.warn("[FaithTracker] failed to load fellowship goal", e); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !window.FB) return;
    const { db, collection, query, where, getDocs } = window.FB;
    (async () => {
      try {
        const q = query(collection(db, "nudges"), where("menteeUid", "==", uid));
        const snap = await getDocs(q);
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));
        setNudges(list);
        const unseen = list.find(n => !n.seen);
        if (unseen) setActiveNudge(unseen);
      } catch (e) { console.warn("[FaithTracker] failed to load nudges", e); }
    })();
  }, [uid]);

  useEffect(() => {
    if (!uid || !user.name || !window.FB) return;
    // Skip the one write that would otherwise fire immediately after we just
    // loaded this exact data from Firestore on login.
    if (skipNextProfileWrite.current) { skipNextProfileWrite.current = false; return; }
    // Debounce so typing a name (e.g. during onboarding) doesn't fire a write per keystroke.
    const handle = setTimeout(() => {
      // Skip the write if name + fellowship (the only fields typed by hand) are unchanged since the last save.
      const last = lastSavedProfile.current;
      const nameSame = last.name === user.name && last.fellowship === (user.fellowship || "");
      const flagsSame = last.isMentor === !!user.isMentor && last.mentorCode === (user.mentorCode || "") && last.mentorUid === (user.mentorUid || "") && last.mentorName === (user.mentorName || "");
      if (nameSame && flagsSame) return;
      lastSavedProfile.current = { name: user.name, fellowship: user.fellowship || "", isMentor: !!user.isMentor, mentorCode: user.mentorCode || "", mentorUid: user.mentorUid || "", mentorName: user.mentorName || "" };
      const { db, doc, setDoc } = window.FB;
      setDoc(doc(db, "members", uid), {
        name: user.name, fellowship: user.fellowship || "",
        isMentor: user.isMentor || false, mentorCode: user.mentorCode || "",
        mentorUid: user.mentorUid || "", mentorName: user.mentorName || "",
      }, { merge: true }).catch(() => showT("Couldn't save your profile — please try again"));
    }, 1500);
    return () => clearTimeout(handle);
  }, [uid, user.name, user.fellowship, user.isMentor, user.mentorCode, user.mentorUid, user.mentorName]);

  useEffect(() => {
    const h = e => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
    window.addEventListener("beforeinstallprompt", h);
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);

  const handleInstall = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    if (r.outcome === "accepted") { setShowInstall(false); showT("App installed"); }
    setDeferredPrompt(null);
  };

  const dismissInstallNudge = () => {
    setInstallNudgeDismissed(true);
    save("ft_install_nudge_dismissed", true);
  };

  const isStandalone = (typeof window !== "undefined") &&
    (window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches));

  const showT = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const todaysEntries = useMemo(() => entries.filter(e => e.date === todayStr()), [entries]);
  const uniqueDays = useMemo(() => [...new Set(entries.map(e => e.date))].length, [entries]);
  const streak = useMemo(() => calcStreakFromDates(entries.map(e => e.date)), [entries]);
  // Yesterday's mood (only if it matches a current mood chip) — used for auto-fill and verse selection
  const yesterdayMood = useMemo(() => {
    const e = entries.find(x => x.date === yesterdayStr());
    return e && MOODS.includes(e.mood) ? e.mood : "";
  }, [entries]);
  const timeOfDay = clockHour < 12 ? "morning" : clockHour < 18 ? "afternoon" : "evening";
  // Contextual verse of the day: (streak, yesterday's mood, time of day) → verse; random fallback otherwise
  const verse = useMemo(
    () => pickContextualVerse({ streak, mood: yesterdayMood ? moodText(yesterdayMood) : "", tod: timeOfDay }) || fallbackVerse,
    [streak, yesterdayMood, timeOfDay, fallbackVerse]);
  // Streak flame: pulses when today's devotion is logged, dims after 6pm if not, grows at 7/30/100 days
  const loggedToday = todaysEntries.length > 0;
  const flameState = (clockHour >= 18 && !loggedToday) ? "flame-dim" : loggedToday ? "flame-lit" : "";
  const flameTier = streak >= 100 ? " flame-m3" : streak >= 30 ? " flame-m2" : streak >= 7 ? " flame-m1" : "";

  const submitLog = async ({ mood, passage, reflect }) => {
    if (!mood)    return showT("Please select a mood");
    if (!reflect) return showT("Please write a reflection");
    const tempId = makeLocalId();
    const newEntry = { date: todayStr(), time: timeStr(), mood, passage, note: reflect, uid, name: user.name, createdAtMs: Date.now() };
    setEntries(prev => [{ id: tempId, ...newEntry }, ...prev]);
    showT("Devotion logged +10 XP");
    setScreen("home");
    if (uid && window.FB) {
      try {
        const { db, collection, addDoc } = window.FB;
        const ref = await addDoc(collection(db, "entries"), newEntry);
        setEntries(prev => prev.map(e => e.id === tempId ? { ...e, id: ref.id } : e));
        await updateMemberStats(uid, { inc: { totalEntries: 1 }, activeDate: newEntry.date }, statsRef);
        if (fellowshipGoal) incrementFellowshipGoal();
      } catch (err) { console.warn("[FaithTracker] save failed", err); showT("Couldn't save to the server (" + ((err && err.code) || "error") + ") — please try again"); }
    }
  };

  const submitPrayer = async ({ prayerCategory, prayerText, prayerScripture, prayerHours }) => {
    if (!prayerCategory) return showT("Please choose a category");
    if (!prayerText.trim()) return showT("Please write what you're praying for");
    const hrs = parseFloat(prayerHours);
    if (!prayerHours || isNaN(hrs) || hrs <= 0) return showT("Please log the time you spent in prayer");
    const tempId = makeLocalId();
    const newPrayer = {
      category: prayerCategory, text: prayerText, scripture: prayerScripture, hours: hrs,
      status: "praying", answeredNote: "", date: todayStr(), time: timeStr(),
      uid, name: user.name, createdAtMs: Date.now(),
    };
    setPrayers(prev => [{ id: tempId, ...newPrayer }, ...prev]);
    showT("Prayer added +" + (hrs * 5) + " XP");
    setScreen("prayer");
    if (uid && window.FB) {
      try {
        const { db, collection, addDoc } = window.FB;
        const ref = await addDoc(collection(db, "prayers"), newPrayer);
        setPrayers(prev => prev.map(p => p.id === tempId ? { ...p, id: ref.id } : p));

  const handleShareSnapshot = async () => {
    if (streak < 3 || snapshotLoading) return;
    setSnapshotLoading(true);
    try {
      const data = getSnapshotData();
      const isDark = theme === "dark";
      const canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1920;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = isDark ? "#0F1626" : "#F8F4EC";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const glow = ctx.createRadialGradient(540, 420, 40, 540, 420, 760);
      glow.addColorStop(0, isDark ? "rgba(217,188,133,0.16)" : "rgba(176,141,87,0.14)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const gold = isDark ? "#D9BC85" : "#8A6A34";
      const ink  = isDark ? "#F2EDE1" : "#1B2A4A";
      ctx.textAlign = "center";

      ctx.fillStyle = gold;
      ctx.font = "600 42px Georgia, serif";
      ctx.fillText("FAITH TRACKER", canvas.width / 2, 210);

      ctx.font = "700 250px Georgia, serif";
      ctx.fillText(String(data.streak), canvas.width / 2, 600);
      ctx.font = "500 40px Georgia, serif";
      ctx.fillStyle = ink;
      ctx.fillText(data.streak === 1 ? "DAY STREAK" : "DAY STREAK", canvas.width / 2, 665);

      const wrapText = (text, x, y, maxWidth, lineHeight) => {
        const words = text.split(" ");
        let line = "", curY = y;
        for (const word of words) {
          const test = line + word + " ";
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line.trim(), x, curY);
            line = word + " "; curY += lineHeight;
          } else line = test;
        }
        ctx.fillText(line.trim(), x, curY);
        return curY;
      };

      let y = 900;
      if (data.verseText) {
        ctx.font = "italic 500 44px Georgia, serif";
        ctx.fillStyle = ink;
        y = wrapText(`"${data.verseText}"`, canvas.width / 2, y, 860, 60);
        if (data.verseRef) {
          ctx.font = "600 30px Georgia, serif";
          ctx.fillStyle = gold;
          ctx.fillText(data.verseRef.toUpperCase(), canvas.width / 2, y + 55);
          y += 150;
        }
      }
      if (data.praiseText) {
        ctx.font = "italic 400 36px Georgia, serif";
        ctx.fillStyle = ink;
        wrapText(`"${data.praiseText}"`, canvas.width / 2, y + 50, 860, 50);
      }

      ctx.font = "500 28px Georgia, serif";
      ctx.fillStyle = gold;
      ctx.fillText("Walking daily with the Holy Spirit", canvas.width / 2, canvas.height - 100);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("canvas export failed");
      const file = new File([blob], "faith-tracker-snapshot.png", { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Faith Tracker", text: "My Faith Tracker snapshot" });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "faith-tracker-snapshot.png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showT("Snapshot saved");
      }
    } catch (e) {
      console.warn("[FaithTracker] snapshot failed", e);
      showT("Couldn't create your snapshot — try again");
    } finally {
      setSnapshotLoading(false);
    }
  };

  if (screen === "history") return renderShell(<JourneyScreen entries={entries} entriesReady={entriesReady} prayers={prayers} prayersReady={prayersReady} setScreen={setScreen} />);
  if (screen === "progress") return renderShell(<ProgressScreen entries={entries} levelInfo={levelInfo} streak={streak} uniqueDays={uniqueDays} user={user} xp={xp} />);
  if (screen === "settings") return renderShell(<SettingsScreen becomeMentor={becomeMentor} cloudReady={cloudReady} copyMentorCode={copyMentorCode} fellowshipGoal={fellowshipGoal} handleClearData={handleClearData} linkToMentor={linkToMentor} openDashboard={openDashboard} openMentees={openMentees} rTime={rTime} setFellowshipGoal={setFellowshipGoal} setRTime={setRTime} setTheme={setTheme} setUser={setUser} shareApp={shareApp} showT={showT} theme={theme} uid={uid} unlinkMentor={unlinkMentor} user={user} />);
  if (screen === "scripture") return renderShell(<ScriptureScreen familiarityLabel={familiarityLabel} openPractice={openPractice} scriptures={scriptures} scripturesReady={scripturesReady} setScreen={setScreen} />);
  if (screen === "scripturesave") return renderShell(<SaveScriptureScreen submitScripture={submitScripture} />);
  if (screen === "scripturepractice" && practiceVerse) return renderShell(<PracticeScreen maskVerseText={maskVerseText} practiceVerse={practiceVerse} ratePractice={ratePractice} />);
  if (screen === "dashboard") return renderShell(<DashboardScreen dashData={dashData} loadDashboardData={loadDashboardData} setScreen={setScreen} />);
  if (screen === "mentees") return renderShell(<MenteesScreen menteeData={menteeData} nudgingMentee={nudgingMentee} sendNudge={sendNudge} setNudgingMentee={setNudgingMentee} setScreen={setScreen} />);

  return null;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(r  => console.log("[FaithTracker] SW ready:", r.scope))
      .catch(e => console.warn("[FaithTracker] SW failed:", e));
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
